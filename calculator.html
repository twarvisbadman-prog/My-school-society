<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator | Twarvis School</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            background:#0a0a1a;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        #matrix-canvas {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index:0;
            background:linear-gradient(180deg,#0a0a2e 0%,#0a0a20 50%,#0a0a1a 100%);
        }
        .calculator-container {
            position:relative;
            z-index:2;
            max-width:500px;
            width:90%;
            padding:20px;
        }
        .calculator-card {
            background:rgba(0,0,0,0.7);
            border:2px solid rgba(0,255,65,0.15);
            border-radius:28px;
            padding:35px;
            backdrop-filter:blur(10px);
            box-shadow:0 0 60px rgba(0,255,65,0.03);
            animation:float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100%{transform:translateY(0px)}
            50%{transform:translateY(-6px)}
        }
        .calculator-card h1 {
            font-size:1.8rem;
            font-weight:800;
            text-align:center;
            margin-bottom:20px;
            background:linear-gradient(135deg,#4a7cf7,#6c9aff);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
        }
        .calculator-card label {
            color:rgba(255,255,255,0.5);
            font-size:0.85rem;
            font-weight:600;
            display:block;
            margin-top:12px;
        }
        .calculator-card input,
        .calculator-card select {
            width:100%;
            padding:12px 16px;
            margin-top:4px;
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(0,255,65,0.08);
            border-radius:12px;
            color:#fff;
            font-size:1rem;
            font-family:inherit;
            transition:0.3s;
        }
        .calculator-card input:focus,
        .calculator-card select:focus {
            outline:none;
            border-color:rgba(0,255,65,0.3);
            box-shadow:0 0 20px rgba(0,255,65,0.03);
        }
        .calculator-card button {
            width:100%;
            padding:14px;
            margin-top:16px;
            background:linear-gradient(135deg,#4a7cf7,#6c9aff);
            border:none;
            border-radius:50px;
            color:#fff;
            font-weight:700;
            font-size:1.05rem;
            cursor:pointer;
            transition:0.3s;
        }
        .calculator-card button:hover {
            transform:scale(1.02);
            box-shadow:0 0 30px rgba(74,124,247,0.2);
        }
        .result-box {
            margin-top:16px;
            padding:16px;
            background:rgba(0,255,65,0.03);
            border:1px solid rgba(0,255,65,0.08);
            border-radius:12px;
            text-align:center;
            color:#fff;
            font-weight:700;
            font-size:1.1rem;
            min-height:60px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .back-link {
            display:inline-block;
            margin-top:16px;
            color:rgba(100,180,255,0.3);
            text-decoration:none;
            font-size:0.85rem;
            transition:0.3s;
        }
        .back-link:hover {
            color:#4a7cf7;
        }
        @media(max-width:480px){
            .calculator-card{padding:24px 18px}
            .calculator-card h1{font-size:1.4rem}
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="calculator-container">
        <div class="calculator-card">
            <h1><i class="fas fa-calculator"></i> GPA Calculator</h1>

            <label>Select Program:</label>
            <select id="programType">
                <option value="diploma">Diploma (4.0 GPA)</option>
                <option value="bachelor">Bachelor (5.0 GPA)</option>
            </select>

            <label>Number of Courses:</label>
            <input type="number" id="numCourses" min="1" value="4">

            <div id="courseInputs"></div>

            <button id="calculateGpa">Calculate GPA</button>
            <div class="result-box" id="gpaResult">Enter your grades to calculate GPA</div>

            <div style="text-align:center;margin-top:12px;">
                <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Matrix rain (simplified)
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const drops = [];
        const columns = Math.ceil(canvas.width / 20);
        for (let i = 0; i < columns; i++) drops[i] = Math.random() * -200;

        function drawRain() {
            ctx.fillStyle = 'rgba(10, 10, 30, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * 20;
                const y = drops[i] * 20;
                ctx.fillStyle = '#4a7cf7';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#4a7cf766';
                ctx.font = 'bold 18px monospace';
                if (y > 0 && y < canvas.height + 50) ctx.fillText(char, x, y);
                ctx.shadowBlur = 0;
                if (drops[i] * 20 > canvas.height + 50 && Math.random() > 0.98) drops[i] = 0;
                drops[i] += 0.4 + Math.random() * 0.3;
            }
            requestAnimationFrame(drawRain);
        }
        drawRain();

        // GPA Calculator
        function generateCourseInputs() {
            const num = parseInt(document.getElementById('numCourses').value) || 4;
            const container = document.getElementById('courseInputs');
            container.innerHTML = '';
            for (let i = 0; i < num; i++) {
                const div = document.createElement('div');
                div.style.margin = '8px 0';
                div.innerHTML = `
                    <label>Course ${i+1}</label>
                    <input type="number" class="course-grade" placeholder="Grade (0-100)" min="0" max="100" step="0.01">
                `;
                container.appendChild(div);
            }
        }

        document.getElementById('numCourses').addEventListener('change', generateCourseInputs);
        document.getElementById('numCourses').addEventListener('input', generateCourseInputs);
        generateCourseInputs();

        document.getElementById('calculateGpa').addEventListener('click', function() {
            const program = document.getElementById('programType').value;
            const maxGpa = program === 'diploma' ? 4.0 : 5.0;
            const grades = document.querySelectorAll('.course-grade');
            let total = 0, count = 0;
            grades.forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val) && val >= 0 && val <= 100) { total += val; count++; }
            });
            if (count === 0) {
                document.getElementById('gpaResult').innerHTML = '❌ Please enter valid grades!';
                document.getElementById('gpaResult').style.color = '#ff4444';
                return;
            }
            const avg = total / count;
            const gpa = (avg / 100) * maxGpa;
            document.getElementById('gpaResult').innerHTML = `
                <div>Program: ${program.charAt(0).toUpperCase() + program.slice(1)}</div>
                <div>Average: ${avg.toFixed(1)}%</div>
                <div style="font-size:1.4rem;margin-top:4px;color:${gpa >= maxGpa * 0.7 ? '#4a7cf7' : '#ff4444'}">
                    GPA: ${gpa.toFixed(2)} / ${maxGpa.toFixed(1)}
                </div>
                <div style="font-size:0.85rem;margin-top:4px;color:${gpa >= maxGpa * 0.7 ? '#00ff41' : '#ff4444'}">
                    ${gpa >= maxGpa * 0.7 ? '✅ Good Standing' : '⚠️ Needs Improvement'}
                </div>
            `;
            document.getElementById('gpaResult').style.color = '#fff';
        });
    </script>
</body>
</html>
