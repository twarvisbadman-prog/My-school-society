<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Calculator | Student Hub</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
    :root {
        --bg: #080b18;
        --panel: #111831;
        --panel2: #182344;
        --text: #eef2ff;
        --muted: #9ca8c8;
        --red: #ff4d5a;
        --blue: #70a8ff;
        --green: #43d392;
        --line: #293454;
        --gold: #ffd166;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { overflow-x: hidden; scroll-behavior: smooth; }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        overflow-x: hidden;
        width: 100%;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    button { font-family: inherit; }

    /* ============================================================
       RAIN CANVAS
       ============================================================ */
    #rain {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.08;
        z-index: 0;
        pointer-events: none;
    }

    .page-wrap { position: relative; z-index: 1; }

    /* ============================================================
       TOP BAR
       ============================================================ */
    .topbar {
        background: #05070f;
        color: var(--text);
        font-size: 0.82rem;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        text-align: center;
    }
    .topbar-inner span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        white-space: nowrap;
    }
    .topbar-inner span i { color: var(--red); font-size: 0.78rem; }

    /* ============================================================
       MAIN NAV
       ============================================================ */
    .mainnav {
        background: rgba(8, 11, 24, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
    }
    .mainnav-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
    }

        display: flex;
        align-items: center;
        gap: 10px;
