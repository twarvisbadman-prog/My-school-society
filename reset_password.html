<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reset Password | Student Hub</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
    --bg:#fafaf9;--surface:#ffffff;--border:#e7e5e4;--ink:#1c1917;--text-2:#44403c;--text-3:#57534e;
    --accent:#c2410c;--accent-bright:#ea580c;--accent-dim:#fff1e8;
    --grad:linear-gradient(120deg,#ea580c,#db2777);
    --grad-cta:linear-gradient(120deg,#c2410c,#be185d);
    --grad-cta-hover:linear-gradient(120deg,#9a3412,#9d174d);
    --success:#15803d;--success-dim:#dcfce7;--danger:#dc2626;--danger-dim:#fee2e2;
    --radius-sm:10px;--radius-lg:20px;--radius-xl:28px;
    --shadow-cta:0 8px 22px -8px rgba(219,39,119,.5);
    --shadow-lg:0 28px 64px -20px rgba(28,25,23,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 25% 25%, rgba(234,88,12,.08) 0%, transparent 50%),radial-gradient(circle at 75% 75%, rgba(219,39,119,.08) 0%, transparent 50%);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
.wrap{position:relative;z-index:1;max-width:440px;width:100%;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px;font-weight:800;font-size:1.4rem;color:var(--ink)}
.logo-img{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#fff;box-shadow:0 8px 20px -6px rgba(219,39,119,.4)}
.logo-text span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px 36px;box-shadow:var(--shadow-lg);text-align:center}
.card-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem}
.card h1{font-size:1.5rem;font-weight:900;color:var(--ink);margin-bottom:10px;letter-spacing:-.02em}
.card p{color:var(--text-2);font-size:.9rem;margin-bottom:24px;line-height:1.6}
.form-group{text-align:left;margin-bottom:18px}
.form-label{display:block;font-weight:700;font-size:.85rem;color:var(--ink);margin-bottom:8px}
.form-label i{color:var(--accent);margin-right:6px}
.form-input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.92rem;font-weight:500;color:var(--ink);background:var(--bg);outline:none;transition:all .25s}
.form-input:focus{border-color:var(--accent-bright);background:var(--surface);box-shadow:0 0 0 4px rgba(234,88,12,.12)}
.btn{width:100%;padding:15px;background:var(--grad-cta);border:none;border-radius:var(--radius-sm);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow-cta);transition:all .25s}
.btn:hover{background:var(--grad-cta-hover);transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.alert{padding:13px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:.85rem;font-weight:600;text-align:left;display:flex;gap:10px;align-items:flex-start}
.alert.success{background:var(--success-dim);border:1px solid #86efac;color:var(--success)}
.alert.error{background:var(--danger-dim);border:1px solid #fca5a5;color:var(--danger)}
.alert i{font-size:1rem;flex-shrink:0;margin-top:1px}
.back-link{display:inline-block;margin-top:20px;color:var(--text-3);font-size:.85rem;font-weight:600}
.back-link:hover{color:var(--accent)}
@media (max-width:560px){.card{padding:32px 22px}.card h1{font-size:1.3rem}.logo-img{width:46px;height:46px}}
</style>
</head>
<body>

<div class="wrap">
    <a href="/" class="logo">
        <img src="/logo.png" alt="Student Hub" class="logo-img">
        <span class="logo-text">Student<span>Hub</span></span>
    </a>

    <div class="card">
        <div class="card-icon"><i class="fas fa-lock"></i></div>
        <h1>Set new password</h1>
        <p>Choose a strong new password for your account.</p>

        <div id="messageBox"></div>

        <form id="resetForm" style="display:none">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> New Password</label>
                <input type="password" id="newPassword" class="form-input" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password" required minlength="6">
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <i class="fas fa-check"></i> Reset Password
            </button>
        </form>

        <div id="loadingBox" style="padding:20px;color:#57534e">
            <i class="fas fa-circle-notch fa-spin" style="font-size:1.5rem;color:#ea580c"></i>
            <p style="margin-top:12px;font-weight:600">Verifying your reset link…</p>
        </div>

        <a href="/login/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ═══════════════════════════════════════════════════════════
// HARDCODED SUPABASE CONFIG — no template variables
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = "https://hnszltswipxiqurkwydm.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhuc3psdHN3aXB4aXF1cmt3eWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTEyODcsImV4cCI6MjA5MzEyNzI4N30.JsSgMXE9JMqJAAZd-riwrr-D-5MURL6WCfuNTrAtoWU";
// ═══════════════════════════════════════════════════════════

(async () => {
    const form = document.getElementById('resetForm');
    const loading = document.getElementById('loadingBox');
    const msgBox = document.getElementById('messageBox');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
        msgBox.innerHTML = `<div class="alert ${type}"><i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i><span>${text}</span></div>`;
    }

    try {
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        // Supabase puts the token in the URL hash for password recovery
        // (#access_token=...&refresh_token=...&type=recovery)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const errorCode = hashParams.get('error');
        const errorDesc = hashParams.get('error_description');

        if (errorCode) {
            throw new Error(errorDesc || 'Invalid or expired link');
        }

        if (accessToken && refreshToken) {
            const { error } = await sb.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken,
            });
            if (error) throw error;

            loading.style.display = 'none';
            form.style.display = 'block';
        } else {
            // Check if there's already a session (rare but possible)
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                loading.style.display = 'none';
                form.style.display = 'block';
            } else {
                throw new Error('No reset token found. Please use the link from your email.');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;

            if (newPass !== confirmPass) {
                showMessage('Passwords do not match.', 'error');
                return;
            }
            if (newPass.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Updating…';

            try {
                const { error } = await sb.auth.updateUser({ password: newPass });
                if (error) throw error;

                showMessage('✓ Password updated! Redirecting to login…', 'success');
                setTimeout(() => {
                    window.location.href = '/login/';
                }, 1500);
            } catch (err) {
                console.error(err);
                showMessage(err.message || 'Could not update password.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Reset Password';
            }
        });

    } catch (err) {
        console.error(err);
        loading.style.display = 'none';
        showMessage(err.message || 'Invalid or expired reset link.', 'error');
    }
})();
</script>
</body>
</html>
