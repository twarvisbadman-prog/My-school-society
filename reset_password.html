<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reset Password | Student Hub</title>
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#fafaf9;--surface:#ffffff;--border:#e7e5e4;--border-strong:#d6d3d1;--ink:#1c1917;--text-2:#44403c;--text-3:#57534e;--accent:#c2410c;--accent-bright:#ea580c;--accent-dim:#fff1e8;--grad:linear-gradient(120deg,#ea580c,#db2777);--grad-cta:linear-gradient(120deg,#c2410c,#be185d);--grad-cta-hover:linear-gradient(120deg,#9a3412,#9d174d);--success:#15803d;--success-dim:#dcfce7;--danger:#dc2626;--danger-dim:#fee2e2;--radius-sm:10px;--radius-lg:20px;--radius-xl:28px;--shadow-cta:0 8px 22px -8px rgba(219,39,119,.5);--shadow-lg:0 28px 64px -20px rgba(28,25,23,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 25% 25%, rgba(234,88,12,.08) 0%, transparent 50%),radial-gradient(circle at 75% 75%, rgba(219,39,119,.08) 0%, transparent 50%);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
.wrap{position:relative;z-index:1;max-width:440px;width:100%;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px;font-weight:800;font-size:1.4rem;color:var(--ink)}
.logo-img{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#fff;box-shadow:0 8px 20px -6px rgba(219,39,119,.4)}
.logo-text span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:40px 36px;box-shadow:var(--shadow-lg);text-align:center}
.card-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:2rem}
.card h1{font-size:1.5rem;font-weight:900;color:var(--ink);margin-bottom:10px;letter-spacing:-.02em}
.card p{color:var(--text-2);font-size:.9rem;margin-bottom:24px;line-height:1.6}
.form-group{text-align:left;margin-bottom:18px}
.form-label{display:block;font-weight:700;font-size:.85rem;color:var(--ink);margin-bottom:8px}
.form-label i{color:var(--accent);margin-right:6px}
.form-input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.92rem;font-weight:500;color:var(--ink);background:var(--bg);outline:none;transition:all .25s}
.form-input:focus{border-color:var(--accent-bright);background:var(--surface);box-shadow:0 0 0 4px rgba(234,88,12,.12)}
.btn{width:100%;padding:15px;background:var(--grad-cta);border:none;border-radius:var(--radius-sm);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow-cta);transition:all .25s}
.btn:hover{background:var(--grad-cta-hover);transform:translateY(-2px)}
.alert{padding:13px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:.85rem;font-weight:600;text-align:left;display:flex;gap:10px;align-items:flex-start}
.alert.success{background:var(--success-dim);border:1px solid #86efac;color:var(--success)}
.alert.error{background:var(--danger-dim);border:1px solid #fca5a5;color:var(--danger)}
.alert i{font-size:1rem;flex-shrink:0;margin-top:1px}
@media (max-width:560px){.card{padding:32px 22px}.card h1{font-size:1.3rem}.logo-img{width:46px;height:46px}}
</style>
</head>
<body>

<div class="wrap">
    <a href="/" class="logo">
        <img src="/apple-touch-icon.png" alt="Student Hub" class="logo-img">
        <span class="logo-text">Student<span>Hub</span></span>
    </a>

    <div class="card">
        <div class="card-icon"><i class="fas fa-lock"></i></div>
        <h1>Set new password</h1>
        <p>Choose a strong new password for your account.</p>

        {% if error %}
        <div class="alert error"><i class="fas fa-exclamation-circle"></i><span>{{ error }}</span></div>
        {% endif %}

        {% if message %}
        <div class="alert success"><i class="fas fa-check-circle"></i><span>{{ message }}</span></div>
        {% endif %}

        {% if not message %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="access_token" value="{{ access_token }}">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> New Password</label>
                <input type="password" name="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Confirm Password</label>
                <input type="password" name="confirm_password" class="form-input" placeholder="Re-enter password" required minlength="6">
            </div>
            <button type="submit" class="btn"><i class="fas fa-check"></i> Reset Password</button>
        </form>
        {% endif %}
    </div>
</div>

</body>
</html>
