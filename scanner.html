<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner | Student Hub ✦</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --board: #000000;
            --chalk: #ededef;
            --chalk-dim: rgba(237, 237, 239, 0.6);

            --blue-900: #172554;
            --blue-800: #1e3a8a;
            --blue-700: #1d4ed8;
            --blue-600: #2563eb;
            --blue-500: #3b82f6;
            --blue-400: #60a5fa;
            --blue-300: #93c5fd;
            --blue-glow: rgba(59, 130, 246, 0.35);
            --blue-dim: rgba(59, 130, 246, 0.15);

            --gold: #fbbf24;
            --gold-bright: #fde68a;
            --gold-glow: rgba(251, 191, 36, 0.35);

            --orange: #f97316;
            --orange-bright: #fb923c;
            --orange-glow: rgba(249, 115, 22, 0.35);

            --cyan: #06b6d4;
            --cyan-bright: #22d3ee;
            --cyan-glow: rgba(6, 182, 212, 0.35);

            --green: #22c55e;
            --green-bright: #4ade80;
            --green-glow: rgba(34, 197, 94, 0.25);

            --red: #ef4444;
            --red-bright: #f87171;
            --red-glow: rgba(239, 68, 68, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #ededef;
            font-family: 'Inter', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* ============================================================
           BLUE BUBBLES FALLING FROM TOP
           ============================================================ */
        .bubbles-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            top: -120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                rgba(96, 165, 250, 0.5) 0%,
                rgba(59, 130, 246, 0.3) 30%,
                rgba(30, 58, 138, 0.1) 60%,
                transparent 100%);
            box-shadow:
                inset 0 0 20px rgba(147, 197, 253, 0.2),
                0 0 30px rgba(59, 130, 246, 0.25);
            border: 1px solid rgba(147, 197, 253, 0.15);
            animation: bubbleFall linear infinite;
            opacity: 0.5;
        }

        @keyframes bubbleFall {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 0.6; }
            50% { transform: translateY(55vh) scale(1); opacity: 0.7; }
            90% { opacity: 0.3; }
            100% { transform: translateY(115vh) scale(0.7); opacity: 0; }
        }

        .bubble:nth-child(1) { left: 5%; width: 60px; height: 60px; animation-duration: 16s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 18%; width: 30px; height: 30px; animation-duration: 18s; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 32%; width: 80px; height: 80px; animation-duration: 15s; animation-delay: 4s; }
        .bubble:nth-child(4) { left: 48%; width: 45px; height: 45px; animation-duration: 20s; animation-delay: 1s; }
        .bubble:nth-child(5) { left: 62%; width: 100px; height: 100px; animation-duration: 22s; animation-delay: 6s; }
        .bubble:nth-child(6) { left: 75%; width: 35px; height: 35px; animation-duration: 17s; animation-delay: 3s; }
        .bubble:nth-child(7) { left: 88%; width: 70px; height: 70px; animation-duration: 19s; animation-delay: 5s; }

        /* ===== FULL SCREEN CAMERA ===== */
        #cameraView {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: #000;
            display: none;
        }
        #cameraView.active {
            display: block;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .scan-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .frame-box {
            width: 80%;
            max-width: 450px;
            aspect-ratio: 3/4;
            border: 2px solid rgba(96, 165, 250, 0.6);
            border-radius: 14px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(59, 130, 246, 0.3);
            position: relative;
            animation: framePulse 3s ease-in-out infinite;
        }

        @keyframes framePulse {
            0%, 100% { border-color: rgba(96, 165, 250, 0.6); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.3); }
            50% { border-color: rgba(147, 197, 253, 1); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5), 0 0 60px rgba(59, 130, 246, 0.5); }
        }

        .frame-box .corner {
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #60a5fa;
            border-style: solid;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
        }
        .frame-box .corner.tl { top: -3px; left: -3px; border-width: 4px 0 0 4px; border-radius: 8px 0 0 0; }
        .frame-box .corner.tr { top: -3px; right: -3px; border-width: 4px 4px 0 0; border-radius: 0 8px 0 0; }
        .frame-box .corner.bl { bottom: -3px; left: -3px; border-width: 0 0 4px 4px; border-radius: 0 0 0 8px; }
        .frame-box .corner.br { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; border-radius: 0 0 8px 0; }

        .frame-label {
            position: absolute;
            bottom: -44px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(147, 197, 253, 0.7);
            font-size: 12px;
            letter-spacing: 3px;
            white-space: nowrap;
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* ===== STATUS ===== */
        #status {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: #93c5fd;
            font-size: 14px;
            text-align: center;
            background: rgba(5, 8, 15, 0.85);
            padding: 10px 24px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(59, 130, 246, 0.4);
            display: none;
            font-weight: 600;
            box-shadow: 0 4px 25px rgba(59, 130, 246, 0.3);
        }

        /* ===== CONTROLS ===== */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            z-index: 15;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 0 20px;
        }
        .controls.active { display: flex; }

        .ctrl-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            transition: 0.3s;
            touch-action: manipulation;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .ctrl-btn:hover:not(:disabled) {
            background: rgba(59, 130, 246, 0.2);
            border-color: #93c5fd;
            color: #93c5fd;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
        }

        .capture-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            touch-action: manipulation;
        }
        .capture-btn:active { transform: scale(0.9); }
        .capture-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .capture-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(96, 165, 250, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
        }
        .capture-dot {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            box-shadow:
                0 0 30px rgba(59, 130, 246, 0.6),
                inset 0 2px 0 rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        /* ============================================
           RESULT PANEL — FOUR OPTIONS
           ============================================ */
        #resultPanel {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 92vh;
            background: rgba(5, 8, 15, 0.98);
            backdrop-filter: blur(25px);
            border-radius: 24px 24px 0 0;
            z-index: 100;
            border-top: 1.5px solid rgba(59, 130, 246, 0.3);
            overflow: hidden;
            padding: 16px 20px 24px;
            animation: slideUp 0.4s ease;
            box-shadow: 0 -20px 60px rgba(59, 130, 246, 0.15);
        }
        #resultPanel.active { display: block; }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        #resultPanel .preview-mini {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            overflow: hidden;
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            margin-bottom: 14px;
        }
        #resultPanel .preview-mini img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 30vh;
            object-fit: contain;
        }

        #resultPanel .page-info {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(147, 197, 253, 0.7);
            margin-bottom: 12px;
            font-weight: 600;
        }
        #resultPanel .page-info span {
            color: #93c5fd;
            font-weight: 800;
        }

        /* ===== FOUR OPTIONS ===== */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-option {
            padding: 14px 10px;
            border: 1.5px solid transparent;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            min-height: 76px;
            justify-content: center;
            touch-action: manipulation;
            letter-spacing: 0.02em;
        }
        .btn-option:active { transform: scale(0.95); }
        .btn-option .icon-big { font-size: 1.6rem; }
        .btn-option .sub-text {
            font-size: 0.6rem;
            font-weight: 500;
            opacity: 0.7;
            font-family: 'Inter', sans-serif;
        }

        .btn-continue {
            background: rgba(30, 58, 138, 0.4);
            border-color: rgba(59, 130, 246, 0.6);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
        }
        .btn-continue:hover {
            background: rgba(30, 58, 138, 0.6);
            border-color: #93c5fd;
            box-shadow: 0 4px 30px rgba(59, 130, 246, 0.5);
        }

        .btn-done {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.5);
            color: #4ade80;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.15);
        }
        .btn-done:hover {
            background: rgba(34, 197, 94, 0.25);
            border-color: #4ade80;
            color: #ffffff;
            box-shadow: 0 4px 30px rgba(34, 197, 94, 0.4);
        }

        .btn-rescan {
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.5);
            color: #22d3ee;
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.15);
        }
        .btn-rescan:hover {
            background: rgba(6, 182, 212, 0.25);
            border-color: #67e8f9;
            color: #ffffff;
            box-shadow: 0 4px 30px rgba(6, 182, 212, 0.4);
        }

        .btn-delete-page {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.1);
        }
        .btn-delete-page:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: #f87171;
            color: #ffffff;
            box-shadow: 0 4px 30px rgba(239, 68, 68, 0.4);
        }

        /* ============================================
           EDIT MODE
           ============================================ */
        #editMode {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 92vh;
            background: rgba(5, 8, 15, 0.98);
            backdrop-filter: blur(25px);
            border-radius: 24px 24px 0 0;
            z-index: 150;
            border-top: 1.5px solid rgba(59, 130, 246, 0.3);
            overflow: hidden;
            padding: 16px 20px 24px;
            animation: slideUp 0.4s ease;
            box-shadow: 0 -20px 60px rgba(59, 130, 246, 0.15);
        }
        #editMode.active { display: block; }

        #editMode .edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        #editMode .edit-header h3 {
            color: #93c5fd;
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        #editMode .edit-header h3 i { color: #60a5fa; }

        #editMode .edit-header button {
            background: rgba(15, 23, 42, 0.5);
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
            transition: 0.25s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        #editMode .edit-header button:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #60a5fa;
            color: #ffffff;
        }

        /* Page thumbnails */
        .edit-pages {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 0 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
        }
        .edit-pages::-webkit-scrollbar { height: 4px; }
        .edit-pages::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.4);
            border-radius: 2px;
        }

        .page-thumb {
            flex-shrink: 0;
            width: 80px;
            height: 100px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(59, 130, 246, 0.2);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            background: #111;
        }
        .page-thumb.active {
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .page-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .page-thumb .page-num {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 10px;
            color: #ffffff;
            background: rgba(30, 58, 138, 0.85);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }
        .page-thumb .drag-handle {
            position: absolute;
            top: 4px;
            left: 4px;
            color: rgba(147, 197, 253, 0.5);
            font-size: 12px;
            cursor: grab;
        }

        .edit-preview-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            overflow: hidden;
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            margin-bottom: 14px;
        }
        .edit-preview-container img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 30vh;
            object-fit: contain;
        }

        .edit-toolbar {
            display: flex;
            gap: 6px;
            padding: 6px 0 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            margin-bottom: 12px;
        }
        .edit-toolbar button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            background: rgba(30, 58, 138, 0.15);
            color: #93c5fd;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .edit-toolbar button.active {
            background: rgba(30, 58, 138, 0.5);
            border-color: #60a5fa;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .edit-toolbar button:hover:not(.active) {
            border-color: #60a5fa;
            color: #ffffff;
        }
        .edit-toolbar button.danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        .edit-toolbar button.danger:hover {
            border-color: #f87171;
            color: #ffffff;
            background: rgba(239, 68, 68, 0.2);
        }
        .edit-toolbar .btn-save {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.4);
            color: #4ade80;
        }
        .edit-toolbar .btn-save:hover {
            border-color: #4ade80;
            color: #ffffff;
            background: rgba(34, 197, 94, 0.25);
        }

        .pdf-naming {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: rgba(30, 58, 138, 0.15);
            border-radius: 12px;
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            flex-wrap: wrap;
        }
        .pdf-naming label {
            font-size: 13px;
            font-weight: 700;
            color: #93c5fd;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .pdf-naming label i { color: #60a5fa; }
        .pdf-naming input {
            flex: 1;
            padding: 8px 14px;
            background: rgba(2, 6, 23, 0.6);
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            outline: none;
            min-width: 80px;
        }
        .pdf-naming input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .pdf-naming .ext {
            color: rgba(147, 197, 253, 0.5);
            font-weight: 700;
            font-size: 14px;
        }

        .btn-create-pdf {
            width: 100%;
            padding: 16px;
            border: 1.5px solid rgba(34, 197, 94, 0.6);
            border-radius: 14px;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 25px rgba(34, 197, 94, 0.2);
            touch-action: manipulation;
            letter-spacing: 0.03em;
            backdrop-filter: blur(10px);
        }
        .btn-create-pdf:active { transform: scale(0.97); }
        .btn-create-pdf:hover {
            background: rgba(34, 197, 94, 0.35);
            border-color: #4ade80;
            color: #ffffff;
            box-shadow: 0 8px 35px rgba(34, 197, 94, 0.5);
            transform: translateY(-2px);
        }

        /* ============================================
           THANK YOU MODAL
           ============================================ */
        #thankYouModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(25px);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #thankYouModal.active { display: flex; }

        .thank-you-box {
            background: rgba(10, 15, 25, 0.98);
            border: 1.5px solid rgba(59, 130, 246, 0.4);
            border-radius: 28px;
            padding: 50px 40px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            animation: popIn 0.5s ease;
            box-shadow:
                0 0 80px rgba(59, 130, 246, 0.3),
                inset 0 0 60px rgba(59, 130, 246, 0.05);
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .thank-you-box .emoji {
            font-size: 4.5rem;
            margin-bottom: 16px;
            display: block;
            animation: bounceEmoji 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.5));
        }
        @keyframes bounceEmoji {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(-5deg); }
        }
        .thank-you-box h2 {
            color: #93c5fd;
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #60a5fa, #93c5fd, #bfdbfe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .thank-you-box p {
            color: rgba(237, 237, 239, 0.65);
            font-size: 1rem;
            margin-bottom: 26px;
            line-height: 1.7;
        }
        .thank-you-box .btn-close-thanks {
            padding: 14px 44px;
            border: 1.5px solid rgba(59, 130, 246, 0.6);
            border-radius: 60px;
            background: rgba(30, 58, 138, 0.4);
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: 0.3s;
            letter-spacing: 0.03em;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }
        .thank-you-box .btn-close-thanks:hover {
            background: rgba(30, 58, 138, 0.65);
            border-color: #93c5fd;
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(59, 130, 246, 0.5);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(5, 8, 15, 0.95);
            backdrop-filter: blur(20px);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            z-index: 300;
            display: none;
            border: 1.5px solid rgba(59, 130, 246, 0.4);
            max-width: 90%;
            text-align: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 4px 25px rgba(59, 130, 246, 0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .frame-box { width: 85%; }
            .capture-ring { width: 70px; height: 70px; }
            .capture-dot { width: 54px; height: 54px; }
            .controls { bottom: 30px; gap: 20px; }
            .ctrl-btn { width: 48px; height: 48px; font-size: 18px; }
            #status { font-size: 12px; top: 70px; padding: 8px 18px; }
            .options-grid { gap: 8px; }
            .btn-option { padding: 12px 8px; font-size: 0.75rem; min-height: 68px; }
            .btn-option .icon-big { font-size: 1.4rem; }
            #resultPanel, #editMode { padding: 14px 16px 20px; }
            .edit-toolbar button { font-size: 10px; padding: 6px 12px; }
            .page-thumb { width: 60px; height: 80px; }
            .thank-you-box { padding: 40px 24px 32px; }
            .thank-you-box h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- BLUE BUBBLES -->
    <div class="bubbles-container">
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- ===== FULL SCREEN CAMERA ===== -->
    <div id="cameraView" class="active">
        <video id="video" autoplay muted playsinline></video>
        <div class="scan-overlay" id="scanOverlay">
            <div class="frame-box">
                <span class="corner tl"></span>
                <span class="corner tr"></span>
                <span class="corner bl"></span>
                <span class="corner br"></span>
                <span class="frame-label">✦ POSITION DOCUMENT ✦</span>
            </div>
        </div>
    </div>

    <!-- STATUS -->
    <div id="status">📷 Starting camera...</div>

    <!-- CONTROLS -->
    <div class="controls active" id="controls">
        <button class="ctrl-btn" id="flashBtn" disabled><i class="fas fa-bolt"></i></button>
        <button class="capture-btn" id="captureBtn" disabled>
            <div class="capture-ring">
                <div class="capture-dot"></div>
            </div>
        </button>
        <button class="ctrl-btn" id="galleryBtn"><i class="fas fa-images"></i></button>
    </div>

    <!-- ===== RESULT PANEL (FOUR OPTIONS) ===== -->
    <div id="resultPanel">
        <div class="preview-mini">
            <img id="previewImage" alt="Scanned page" />
        </div>
        <div class="page-info">
            Page <span id="pageNum">1</span> of <span id="totalPages">1</span>
        </div>
        <div class="options-grid">
            <button class="btn-option btn-continue" id="continueBtn">
                <span class="icon-big">📸</span>
                CONTINUE
                <span class="sub-text">Scan next page</span>
            </button>
            <button class="btn-option btn-done" id="doneBtn">
                <span class="icon-big">✅</span>
                DONE
                <span class="sub-text">Finish &amp; edit</span>
            </button>
            <button class="btn-option btn-rescan" id="rescanBtn">
                <span class="icon-big">🔄</span>
                RESCAN
                <span class="sub-text">Retake this page</span>
            </button>
            <button class="btn-option btn-delete-page" id="deletePageBtn">
                <span class="icon-big">🗑️</span>
                DELETE
                <span class="sub-text">Remove this page</span>
            </button>
        </div>
    </div>

    <!-- ===== EDIT MODE ===== -->
    <div id="editMode">
        <div class="edit-header">
            <h3><i class="fas fa-edit"></i> Edit Document</h3>
            <button id="backToOptions"><i class="fas fa-arrow-left"></i> Back</button>
        </div>

        <div class="edit-pages" id="editPages"></div>

        <div class="edit-preview-container">
            <img id="editPreview" alt="Document" />
        </div>

        <div class="edit-toolbar">
            <button class="active" data-filter="original">Original</button>
            <button data-filter="grayscale">⚫ B&amp;W</button>
            <button data-filter="enhance">✨ Enhance</button>
            <button data-filter="vintage">📻 Vintage</button>
            <button id="rotateBtn">🔄 Rotate</button>
            <button id="deleteEditBtn" class="danger">🗑️ Delete</button>
            <button id="saveBtn" class="btn-save">💾 Save</button>
        </div>

        <div class="pdf-naming">
            <label><i class="fas fa-file-pdf"></i> Name:</label>
            <input type="text" id="pdfName" value="twarvis" />
            <span class="ext">.pdf</span>
        </div>

        <button class="btn-create-pdf" id="createPdfBtn">
            <i class="fas fa-file-pdf"></i> CREATE PDF &amp; DOWNLOAD
        </button>
    </div>

    <!-- ===== THANK YOU MODAL ===== -->
    <div id="thankYouModal">
        <div class="thank-you-box">
            <span class="emoji">🎉</span>
            <h2>Thank You!</h2>
            <p>
                Thanks for using Student Hub!<br />
                Please come again.<br />
                <span style="color:rgba(147,197,253,0.7); font-weight: 600;">You're welcome! ✦</span>
            </p>
            <button class="btn-close-thanks" id="closeThankYou">Continue</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jscanify@1.2.0/dist/jscanify.min.js"></script>
    <script>
        // ============================================
        // COMPLETE SCANNER — FUNCTIONALITY UNCHANGED
        // ============================================

        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');
        const flashBtn = document.getElementById('flashBtn');
        const galleryBtn = document.getElementById('galleryBtn');
        const cameraView = document.getElementById('cameraView');
        const controls = document.getElementById('controls');
        const scanOverlay = document.getElementById('scanOverlay');

        const resultPanel = document.getElementById('resultPanel');
        const previewImage = document.getElementById('previewImage');
        const pageNum = document.getElementById('pageNum');
        const totalPages = document.getElementById('totalPages');

        const continueBtn = document.getElementById('continueBtn');
        const doneBtn = document.getElementById('doneBtn');
        const rescanBtn = document.getElementById('rescanBtn');
        const deletePageBtn = document.getElementById('deletePageBtn');

        const editMode = document.getElementById('editMode');
        const editPreview = document.getElementById('editPreview');
        const editPages = document.getElementById('editPages');
        const backToOptions = document.getElementById('backToOptions');
        const rotateBtn = document.getElementById('rotateBtn');
        const deleteEditBtn = document.getElementById('deleteEditBtn');
        const saveBtn = document.getElementById('saveBtn');
        const createPdfBtn = document.getElementById('createPdfBtn');
        const pdfNameInput = document.getElementById('pdfName');

        const thankYouModal = document.getElementById('thankYouModal');
        const closeThankYou = document.getElementById('closeThankYou');

        const toast = document.getElementById('toast');

        let stream = null;
        let pages = [];
        let currentPageIndex = 0;
        let currentFilter = 'original';
        let isProcessing = false;

        // ============================================
        // TOAST
        // ============================================
        function showToast(msg, type = 'info') {
            toast.textContent = msg;
            toast.style.display = 'block';
            toast.className = 'toast';
            if (type === 'error') toast.style.borderColor = 'rgba(239,68,68,0.6)';
            if (type === 'success') toast.style.borderColor = 'rgba(34,197,94,0.6)';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ============================================
        // STATUS
        // ============================================
        function setStatus(msg, color = '#93c5fd') {
            statusDiv.textContent = msg;
            statusDiv.style.color = color;
            statusDiv.style.display = 'block';
        }

        function hideStatus() {
            statusDiv.style.display = 'none';
        }

        // ============================================
        // CAMERA
        // ============================================
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                video.srcObject = null;
            }
        }

        async function startCamera() {
            try {
                stopCamera();
                captureBtn.disabled = true;
                flashBtn.disabled = true;
                resultPanel.classList.remove('active');
                editMode.classList.remove('active');
                cameraView.classList.add('active');
                controls.classList.add('active');
                scanOverlay.style.display = 'flex';
                hideStatus();

                if (location.protocol !== 'https:' &&
                    location.hostname !== 'localhost' &&
                    location.hostname !== '127.0.0.1') {
                    setStatus('⚠️ Camera requires HTTPS or localhost.', '#f87171');
                    return;
                }

                setStatus('📷 Starting camera...');

                let constraints = {
                    audio: false,
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 } }
                    });
                }

                video.srcObject = stream;

                await new Promise((resolve) => {
                    if (video.readyState >= 1) { resolve(); } else { video.onloadedmetadata = () => resolve(); }
                });

                await video.play();

                captureBtn.disabled = false;
                flashBtn.disabled = false;
                setStatus('✅ Tap the circle to scan', '#4ade80');
                setTimeout(hideStatus, 2000);

            } catch (error) {
                console.error('Camera error:', error);
                captureBtn.disabled = true;
                let msg = '❌ Camera error. ';
                if (error.name === 'NotAllowedError') msg += 'Please allow camera permission.';
                else if (error.name === 'NotFoundError') msg += 'No camera found.';
                else msg += error.message;
                setStatus(msg, '#f87171');

                const retryBtn = document.createElement('button');
                retryBtn.textContent = '🔄 Retry Camera';
                retryBtn.style.cssText =
                    'position:fixed;bottom:130px;left:50%;transform:translateX(-50%);z-index:20;padding:12px 30px;background:rgba(30,58,138,0.6);color:#fff;border:1.5px solid rgba(59,130,246,0.6);border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px);font-family:inherit;';
                retryBtn.onclick = () => { retryBtn.remove(); startCamera(); };
                document.body.appendChild(retryBtn);
            }
        }

        // ============================================
        // CAPTURE
        // ============================================
        function capture() {
            if (isProcessing) return;
            if (!stream) { showToast('❌ Camera not running', 'error'); return; }
            if (!video.videoWidth || !video.videoHeight) { showToast('⏳ Camera preparing...'); return; }

            isProcessing = true;
            captureBtn.disabled = true;
            setStatus('📸 Capturing...');

            try {
                const width = video.videoWidth;
                const height = video.videoHeight;

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
                ctx.drawImage(video, 0, 0, width, height);

                let finalCanvas = canvas;
                try {
                    if (typeof Jscanify !== 'undefined') {
                        const scanner = new Jscanify();
                        const cropped = scanner.extractPaper(canvas, 5);
                        if (cropped && cropped.width > 100 && cropped.height > 100) {
                            finalCanvas = cropped;
                        }
                    }
                } catch (e) { console.warn('Auto-crop failed', e); }

                const imageData = finalCanvas.toDataURL('image/png');

                pages.push(imageData);
                currentPageIndex = pages.length - 1;

                cameraView.classList.remove('active');
                controls.classList.remove('active');
                resultPanel.classList.add('active');
                previewImage.src = pages[currentPageIndex];
                pageNum.textContent = currentPageIndex + 1;
                totalPages.textContent = pages.length;

                stopCamera();
                hideStatus();
                showToast('✅ Page scanned!');

            } catch (error) {
                console.error('Capture error:', error);
                showToast('❌ Capture failed: ' + error.message, 'error');
            } finally {
                isProcessing = false;
                captureBtn.disabled = false;
            }
        }

        // ============================================
        // UPDATE RESULT PANEL
        // ============================================
        function updateResultPanel() {
            if (pages.length > 0) {
                previewImage.src = pages[currentPageIndex];
                pageNum.textContent = currentPageIndex + 1;
                totalPages.textContent = pages.length;
            }
        }

        // ============================================
        // FOUR OPTIONS
        // ============================================

        continueBtn.addEventListener('click', function() {
            resultPanel.classList.remove('active');
            startCamera();
            showToast('📸 Scan next page');
        });

        doneBtn.addEventListener('click', function() {
            if (pages.length === 0) { showToast('❌ No pages to edit', 'error'); return; }
            resultPanel.classList.remove('active');
            editMode.classList.add('active');
            renderEditPages();
            editPreview.src = pages[currentPageIndex];
            showToast('✏️ Edit your document');
        });

        rescanBtn.addEventListener('click', function() {
            if (pages.length === 0) return;

            pages.splice(currentPageIndex, 1);

            if (pages.length === 0) {
                resultPanel.classList.remove('active');
                showToast('🔄 No pages left. Scan again.');
                startCamera();
                return;
            }

            currentPageIndex = Math.min(currentPageIndex, pages.length - 1);
            updateResultPanel();
            showToast('🔄 Page removed. Camera opening...');

            setTimeout(() => {
                resultPanel.classList.remove('active');
                startCamera();
                showToast('📸 Scan replacement page');
            }, 500);
        });

        deletePageBtn.addEventListener('click', function() {
            if (pages.length === 0) return;

            pages.splice(currentPageIndex, 1);

            if (pages.length === 0) {
                resultPanel.classList.remove('active');
                showToast('🗑️ Page deleted. No pages left.');
                startCamera();
                return;
            }

            currentPageIndex = Math.min(currentPageIndex, pages.length - 1);
            updateResultPanel();
            showToast('🗑️ Page deleted');
        });

        // ============================================
        // BACK TO OPTIONS
        // ============================================
        backToOptions.addEventListener('click', function() {
            editMode.classList.remove('active');
            resultPanel.classList.add('active');
            updateResultPanel();
            showToast('📄 Back to pages');
        });

        // ============================================
        // RENDER EDIT PAGES
        // ============================================
        function renderEditPages() {
            editPages.innerHTML = '';
            pages.forEach((dataUrl, index) => {
                const div = document.createElement('div');
                div.className = 'page-thumb' + (index === currentPageIndex ? ' active' : '');
                div.innerHTML = `
                    <img src="${dataUrl}" alt="Page ${index+1}" />
                    <span class="page-num">${index+1}</span>
                    <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
                `;
                div.addEventListener('click', function() {
                    currentPageIndex = index;
                    document.querySelectorAll('.page-thumb').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    editPreview.src = pages[currentPageIndex];
                });
                editPages.appendChild(div);
            });
        }

        // ============================================
        // FILTERS
        // ============================================
        document.querySelectorAll('[data-filter]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilter();
            });
        });

        function applyFilter() {
            if (pages.length === 0) return;
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i + 1], b = data[i + 2];
                    switch (currentFilter) {
                        case 'grayscale':
                            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                            r = g = b = gray;
                            break;
                        case 'enhance':
                            r = Math.min(255, r * 1.1 + 5);
                            g = Math.min(255, g * 1.1 + 5);
                            b = Math.min(255, b * 1.1 + 5);
                            break;
                        case 'vintage':
                            r = Math.min(255, r * 1.1 + 10);
                            g = Math.min(255, g * 0.9 + 5);
                            b = Math.min(255, b * 0.8 + 5);
                            break;
                        default: break;
                    }
                    data[i] = r;
                    data[i + 1] = g;
                    data[i + 2] = b;
                }
                ctx.putImageData(imageData, 0, 0);
                pages[currentPageIndex] = canvas.toDataURL('image/png');
                editPreview.src = pages[currentPageIndex];
                renderEditPages();
            };
            img.src = pages[currentPageIndex];
        }

        // ============================================
        // ROTATE
        // ============================================
        rotateBtn.addEventListener('click', function() {
            if (pages.length === 0) return;
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.height;
                canvas.height = img.width;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(Math.PI / 2);
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
                pages[currentPageIndex] = canvas.toDataURL('image/png');
                editPreview.src = pages[currentPageIndex];
                renderEditPages();
                showToast('🔄 Rotated 90°');
            };
            img.src = pages[currentPageIndex];
        });

        // ============================================
        // DELETE (Edit Mode)
        // ============================================
        deleteEditBtn.addEventListener('click', function() {
            if (pages.length === 0) return;
            pages.splice(currentPageIndex, 1);
            if (pages.length === 0) {
                showToast('No pages left');
                editMode.classList.remove('active');
                startCamera();
                return;
            }
            currentPageIndex = Math.min(currentPageIndex, pages.length - 1);
            renderEditPages();
            editPreview.src = pages[currentPageIndex];
            showToast('🗑️ Page deleted');
        });

        // ============================================
        // SAVE
        // ============================================
        saveBtn.addEventListener('click', function() {
            showToast('✅ Changes saved!');
        });

        // ============================================
        // CREATE PDF + THANK YOU
        // ============================================
        createPdfBtn.addEventListener('click', function() {
            if (pages.length === 0) { showToast('❌ No pages', 'error'); return; }
            if (typeof window.jspdf === 'undefined') { showToast('❌ PDF library not loaded', 'error'); return; }

            showToast('📄 Creating PDF...');
            const { jsPDF } = window.jspdf;
            const name = pdfNameInput.value.trim() || 'twarvis';
            const pdf = new jsPDF();

            let loaded = 0;
            pages.forEach((dataUrl, index) => {
                const img = new Image();
                img.onload = function() {
                    if (index > 0) pdf.addPage();
                    const imgWidth = pdf.internal.pageSize.width;
                    const imgHeight = (this.height / this.width) * imgWidth;
                    pdf.addImage(dataUrl, 'PNG', 0, 0, imgWidth, imgHeight);
                    loaded++;
                    if (loaded === pages.length) {
                        pdf.save(`${name}.pdf`);
                        showToast(`✅ ${name}.pdf saved!`);

                        setTimeout(() => {
                            thankYouModal.classList.add('active');
                        }, 500);

                        pages = [];
                        currentPageIndex = 0;
                        editMode.classList.remove('active');
                        resultPanel.classList.remove('active');
                        startCamera();
                    }
                };
                img.src = dataUrl;
            });
        });

        // ============================================
        // CLOSE THANK YOU
        // ============================================
        closeThankYou.addEventListener('click', function() {
            thankYouModal.classList.remove('active');
        });

        // ============================================
        // GALLERY
        // ============================================
        galleryBtn.addEventListener('click', function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.multiple = true;
            input.onchange = function(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                let loaded = 0;
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            const dataUrl = canvas.toDataURL('image/png');
                            pages.push(dataUrl);
                            currentPageIndex = pages.length - 1;
                            loaded++;
                            if (loaded === files.length) {
                                cameraView.classList.remove('active');
                                controls.classList.remove('active');
                                resultPanel.classList.add('active');
                                previewImage.src = pages[currentPageIndex];
                                pageNum.textContent = currentPageIndex + 1;
                                totalPages.textContent = pages.length;
                                stopCamera();
                                showToast(`📸 Added ${files.length} images`);
                            }
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };
            input.click();
        });

        // ============================================
        // FLASH
        // ============================================
        flashBtn.addEventListener('click', function() {
            if (!stream) return;
            const track = stream.getVideoTracks()[0];
            if (!track) return;
            try {
                const settings = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !settings.torch }] })
                    .then(() => showToast(settings.torch ? '💡 Flash off' : '💡 Flash on'));
            } catch (err) {
                showToast('💡 Flash not supported', 'error');
            }
        });

        // ============================================
        // CAPTURE BUTTON
        // ============================================
        captureBtn.addEventListener('click', capture);

        // ============================================
        // START
        // ============================================
        startCamera();

        console.log('📱 Complete Scanner — Blue Vibe Loaded');
    </script>
</body>
</html>
