<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learn HTML & CSS — Guided Course | Student Hub</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#080b18;--panel:#111831;--panel2:#182344;--text:#eef2ff;--muted:#9ca8c8;
  --red:#ff4d5a;--blue:#70a8ff;--green:#43d392;--gold:#ffd166;--line:#293454;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.55;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.06;z-index:0;pointer-events:none}
.page{position:relative;z-index:1}

.topbar{background:#05070f;color:var(--text);font-size:.82rem;padding:8px 0;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;text-align:center}
.topbar-inner span{display:inline-flex;align-items:center;gap:8px;color:var(--muted);white-space:nowrap}
.topbar-inner span i{color:var(--red);font-size:.78rem}

.mainnav{background:rgba(8,11,24,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;width:100%}
.mainnav-inner{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--text);letter-spacing:-.02em;flex-shrink:0}
.logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--red),#ff7b62);border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem;flex-shrink:0;box-shadow:0 4px 15px rgba(255,77,90,.35)}
.logo-text span{color:var(--red)}
.menu{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center;flex:1;min-width:0}
.menu a{padding:8px 11px;font-size:.84rem;font-weight:600;color:var(--muted);border-radius:8px;white-space:nowrap;transition:all .25s ease}
.menu a:hover{color:var(--text);background:var(--panel2)}
.menu a.active{color:var(--text);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.menu a.course-link{color:var(--red)}
.menu a.hack-link{color:var(--blue)}
.menu a.course-link i,.menu a.hack-link i{font-size:.75rem;margin-right:5px}
.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.btn-quote{background:var(--red);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:8px;transition:all .25s ease;white-space:nowrap;box-shadow:0 4px 15px rgba(255,77,90,.3)}
.btn-quote:hover{background:#ff2f3e;transform:translateY(-1px);box-shadow:0 8px 22px rgba(255,77,90,.45)}

/* LAYOUT */
.shell{max-width:1280px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}

/* SIDEBAR (curriculum) */
.side-panel{background:rgba(15,21,43,.95);border:1px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
.side-panel::-webkit-scrollbar{width:6px}
.side-panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.side-head h3{font-size:.9rem;font-weight:800;letter-spacing:.02em}
.side-head .mini-progress{font-size:.72rem;color:var(--green);font-weight:800}
.side-progress{height:6px;background:#29314d;border-radius:20px;overflow:hidden;margin-bottom:14px}
.side-progress .fill{height:100%;background:linear-gradient(90deg,var(--red),#ffad62);width:0;transition:.4s;border-radius:20px}
.side-reset{width:100%;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:.75rem;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;margin-top:14px;transition:.2s}
.side-reset:hover{color:var(--red);border-color:var(--red)}

.side-module{margin-bottom:6px}
.side-module-title{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);padding:10px 4px 6px}
.side-lesson{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.84rem;color:var(--muted);transition:.15s;border-left:2px solid transparent}
.side-lesson:hover{background:var(--panel2);color:var(--text)}
.side-lesson.current{background:rgba(255,77,90,.1);color:var(--text);border-left-color:var(--red);font-weight:700}
.side-lesson.done .num2{background:var(--green);color:#061b14;border-color:var(--green)}
.num2{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:.68rem;font-weight:800;flex-shrink:0;color:var(--muted)}
.side-lesson.current .num2{background:var(--red);color:#fff;border-color:var(--red)}

/* MAIN STAGE */
.stage{background:rgba(15,21,43,.95);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;background:rgba(24,35,68,.5)}
.crumb{color:var(--red);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.stage-head h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.stage-dots{display:flex;gap:5px}
.stage-dots span{width:6px;height:6px;border-radius:50%;background:#29314d;transition:.3s}
.stage-dots span.active{background:var(--red);width:20px;border-radius:3px}
.stage-dots span.done{background:var(--green)}

.stage-body{padding:26px 26px 30px}
.task-block{background:rgba(112,168,255,.06);border-left:3px solid var(--blue);padding:14px 16px;border-radius:0 10px 10px 0;margin-bottom:18px;font-size:.92rem;line-height:1.7;color:#d6e1f7}
.task-block strong{color:var(--text)}
.instruction{color:var(--muted);font-size:.92rem;line-height:1.75;margin-bottom:14px}
.instruction strong{color:var(--text)}

.example-box{background:#080b18;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0 20px;overflow-x:auto}
.example-box .lbl{color:var(--red);font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:8px}
.example-box pre{color:#a1e8bd;font:13px/1.7 'JetBrains Mono',monospace;white-space:pre-wrap}

/* HINTS */
.hint-toggle{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:8px 14px;font-size:.78rem;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-top:8px}
.hint-toggle:hover{color:var(--gold);border-color:var(--gold)}
.hint-box{display:none;background:rgba(255,209,102,.08);border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 10px 10px 0;margin-top:10px;color:#f5e0b3;font-size:.85rem;line-height:1.7}
.hint-box.open{display:block}
.hint-box strong{color:var(--gold)}

/* WORKSPACE */
.workspace{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a1228}
.ws-header{background:#0a1228;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.ws-tabs{display:flex;gap:4px;background:#080b18;padding:4px;border-radius:9px}
.ws-tab{padding:6px 14px;background:transparent;border:none;color:var(--muted);font-weight:700;font-size:.76rem;border-radius:6px;cursor:pointer;transition:.2s;font-family:'JetBrains Mono',monospace}
.ws-tab.active{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.ws-actions{display:flex;gap:6px;flex-wrap:wrap}
.ws-action{padding:6px 12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;font-size:.74rem;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.ws-action:hover{background:#1f2c55;border-color:#3a4668}
.ws-body{display:grid;grid-template-columns:1fr 1fr;min-height:340px}
.ws-editor{background:#080b18;border-right:1px solid var(--line);position:relative}
.ws-editor textarea{width:100%;height:100%;min-height:340px;background:#080b18;color:#a1e8bd;border:none;font:13px/1.7 'JetBrains Mono',monospace;padding:14px;resize:none;outline:none;tab-size:2;white-space:pre;overflow:auto}
.ws-preview{background:#fff;min-height:340px}
.ws-preview iframe{width:100%;height:100%;border:none;display:block;min-height:340px;background:#fff}

/* FEEDBACK */
.feedback{margin-top:20px;padding:16px 18px;border-radius:12px;display:none;align-items:flex-start;gap:12px;font-size:.9rem;line-height:1.7}
.feedback.show{display:flex}
.feedback.success{background:rgba(67,211,146,.08);border:1px solid rgba(67,211,146,.35);color:var(--green)}
.feedback.success strong{color:#b6f5d4}
.feedback.error{background:rgba(255,77,90,.08);border:1px solid rgba(255,77,90,.35);color:#ffb0b6}
.feedback.error strong{color:#ffd0d4}
.feedback i{font-size:1.2rem;margin-top:2px;flex-shrink:0}
.feedback.success i{color:var(--green)}
.feedback.error i{color:var(--red)}

.stage-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
.btn{padding:12px 22px;border-radius:10px;font-weight:800;font-size:.88rem;cursor:pointer;border:none;transition:.2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 4px 15px rgba(255,77,90,.3)}
.btn-primary:hover{background:#ff2f3e;transform:translateY(-1px)}
.btn-primary:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed;box-shadow:none;transform:none}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.btn-check{background:var(--blue);color:#061224;box-shadow:0 4px 15px rgba(112,168,255,.3)}
.btn-check:hover{background:#8ab9ff;transform:translateY(-1px)}

.celebrate{display:none;text-align:center;padding:32px 20px}
.celebrate.show{display:block}
.celebrate .big-emoji{font-size:3.5rem;display:block;margin-bottom:12px;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.celebrate h2{font-size:1.4rem;font-weight:900;color:var(--green);margin-bottom:8px}
.celebrate p{color:var(--muted);font-size:.9rem}

footer{background:#05070f;padding:40px 20px 20px;border-top:1px solid var(--line);position:relative;z-index:1;margin-top:40px}
.footer-inner{max-width:1280px;margin:0 auto;text-align:center}
.footer-inner p{color:var(--muted);font-size:.82rem}
.footer-inner a{color:var(--red);font-weight:700}

@media(max-width:960px){
  .shell{grid-template-columns:1fr;padding:16px}
  .side-panel{position:static;max-height:none}
  .ws-body{grid-template-columns:1fr}
  .ws-editor{border-right:none;border-bottom:1px solid var(--line)}
}
@media(max-width:720px){
  .mainnav-inner{flex-wrap:wrap;padding:12px 16px;gap:12px}
  .menu{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;gap:0}
  .menu::-webkit-scrollbar{display:none}
  .menu a{padding:8px 12px;font-size:.8rem;flex-shrink:0}
  .stage-body{padding:18px 16px 22px}
  .stage-head{padding:16px 18px}
}
@media(max-width:480px){
  .topbar-inner span:nth-child(3){display:none}
  .btn-quote span{display:none}
  .stage-foot .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<div class="page">

<div class="topbar">
  <div class="topbar-inner">
    <span><i class="fas fa-phone"></i> +255 740 706 007</span>
    <span><i class="fas fa-envelope"></i> Twarvistech@gmail.com</span>
    <span><i class="fas fa-map-marker-alt"></i> Dar es Salaam, Tanzania</span>
  </div>
</div>

<nav class="mainnav">
  <div class="mainnav-inner">
    <a href="/" class="logo">
      <span class="logo-mark"><i class="fas fa-graduation-cap"></i></span>
      <span class="logo-text">Student<span>Hub</span></span>
    </a>
    <div class="menu">
      <a href="/">Home</a>
      <a href="/browse/">Browse</a>
      <a href="/upload/">Upload</a>
      <a href="/calculator/">Calculator</a>
      <a href="/scanner/">Scanner</a>
      <a href="/free_course/" class="course-link active"><i class="fas fa-book-open"></i>Free Courses</a>
      <a href="/hackerthon/" class="hack-link"><i class="fas fa-code"></i>Hackathon</a>
      <a href="/about/">About</a>

      <a href="/upload/" class="btn-quote"><span>Upload File</span> <i class="fas fa-arrow-right"></i></a>

<div class="shell">

  <!-- SIDEBAR CURRICULUM -->
  <aside class="side-panel">
    <div class="side-head">
      <h3>Curriculum</h3>
      <span class="mini-progress" id="miniProgress">0%</span>
    </div>
    <div class="side-progress"><div class="fill" id="sideFill"></div></div>
    <div id="curriculum"></div>
    <button class="side-reset" id="resetAll">Reset all progress</button>
  </aside>

  <!-- STAGE -->
  <main class="stage">

    <div class="stage-head">
      <div>
        <div class="crumb" id="crumb">Chapter 1 · HTML Foundations</div>
        <h1 id="stageTitle">Lesson 1 — Your first heading</h1>
      </div>
      <div class="stage-dots" id="stageDots"></div>
    </div>

    <div class="stage-body">
      <div id="lessonContent"></div>
    </div>

  </main>

</div>

<footer>
  <div class="footer-inner">
    <p>© 2026 Student Hub · <a href="/">Home</a> · <a href="/free_course/">Courses</a> · <a href="/hackerthon/">Hackathon</a></p>
  </div>
</footer>

</div>

<script>
// ============================================================
// LESSON DATA — real, sequential, with check functions
// Each lesson:
//   id: unique
//   chapter: module name
//   title: short label shown in sidebar
//   goal: "what you will learn"
//   task: what the student must DO
//   example: code shown to them
//   hint: expandable help
//   starter: code they begin with
//   check: function (html, css) => {ok:boolean, msg:string}
// ============================================================
var lessons = [

  // ---------- CHAPTER 1: HEADINGS & PARAGRAPHS ----------
  {
    id: 'c1l1',
    chapter: 'Chapter 1 · Text basics',
    title: 'Your first heading',
    goal: 'Learn what a heading is and how to write one.',
    task: 'Write a heading using the <code>&lt;h1&gt;</code> tag. Put any title you like inside it — for example "My First Page".',
    example:'<h1>My First Page</h1>',
    hint:'The &lt;h1&gt; tag opens with &lt;h1&gt; and closes with &lt;/h1&gt;. Everything between them is the heading text.',
    starter:'<!-- Type your heading below -->\n',
    check: function(html){
      var m = html.match(/<h1[^>]*>([\s\S]+?)<\/h1>/i);
      if(!m) return {ok:false, msg:'I could not find an h1 heading. Write one like <h1>My First Page</h1>.'};
      if(!m[1].trim()) return {ok:false, msg:'Your h1 tag is empty. Put text inside it, like <h1>Hello</h1>.'};
      return {ok:true, msg:'Nice work! You created a real heading. The browser shows it as the biggest title on the page.'};
    }
  },
  {
    id: 'c1l2',
    chapter: 'Chapter 1 · Text basics',
    title: 'Add a paragraph',
    goal: 'Learn how to write paragraphs of text.',
    task: 'Keep your <code>&lt;h1&gt;</code> heading, then add a <code>&lt;p&gt;</code> paragraph below it describing what this page is about.',
    example:'<h1>My First Page</h1>\n<p>This page is about learning HTML step by step.</p>',
    hint:'A paragraph uses &lt;p&gt; opening and &lt;/p&gt; closing tags. Put one or more sentences inside.',
    starter:'<h1>My First Page</h1>\n\n<!-- Add your paragraph below -->\n',
    check: function(html){
      if(!/<h1[^>]*>[\s\S]+?<\/h1>/i.test(html)) return {ok:false, msg:'Your h1 from the last lesson is gone. Keep it, then add a paragraph below.'};
      var m = html.match(/<p[^>]*>([\s\S]+?)<\/p>/i);
      if(!m) return {ok:false, msg:'I could not find a paragraph. Add <p>Your text here</p> below the heading.'};
      if(!m[1].trim()) return {ok:false, msg:'Your paragraph is empty. Put a sentence inside it.'};
      return {ok:true, msg:'Perfect! You now have a heading and a paragraph — the two most common tags on the web.'};
    }
  },
  {
    id: 'c1l3',
    chapter: 'Chapter 1 · Text basics',
    title: 'Two paragraphs',
    goal: 'Practice writing multiple paragraphs that stack on the page.',
    task: 'Add a <strong>second</strong> <code>&lt;p&gt;</code> paragraph below your first one. Each paragraph sits on its own line.',
    example:'<h1>My First Page</h1>\n<p>First paragraph here.</p>\n<p>Second paragraph here.</p>',
    hint:'Just write another pair of &lt;p&gt;...&lt;/p&gt; tags. HTML automatically puts space between paragraphs.',
    starter:'<h1>My First Page</h1>\n<p>First paragraph here.</p>\n\n<!-- Add a second paragraph below -->\n',
    check: function(html){
      var matches = html.match(/<p[^>]*>[\s\S]+?<\/p>/gi) || [];
      if(matches.length < 2) return {ok:false, msg:'I only see ' + matches.length + ' paragraph. Add one more <p>...</p>.'};
      return {ok:true, msg:'Great! Two paragraphs now. HTML will stack them one after the other.'};
    }
  },
  {
    id: 'c1l4',
    chapter: 'Chapter 1 · Text basics',
    title: 'Emphasize with bold',
    goal: 'Learn how to make text bold to give it importance.',
    task: 'Inside one of your paragraphs, wrap <strong>one word or phrase</strong> with the <code>&lt;strong&gt;</code> tag.',
    example:'<p>This is <strong>very important</strong> text.</p>',
    hint:'&lt;strong&gt;...&lt;/strong&gt; lives INSIDE a paragraph: &lt;p&gt;Normal &lt;strong&gt;bold&lt;/strong&gt; normal&lt;/p&gt;',
    starter:'<h1>My First Page</h1>\n<p>First paragraph here.</p>\n<p>Second paragraph here.</p>\n\n<!-- Add <strong> inside a paragraph -->\n',
    check: function(html){
      if(!/<strong[^>]*>[\s\S]+?<\/strong>/i.test(html)) return {ok:false, msg:'I could not find any <strong>...</strong> tag. Wrap a word inside your paragraph with it.'};
      return {ok:true, msg:'Excellent! <strong> makes text bold. It also tells screen readers that the text matters.'};
    }
  },
  {
    id: 'c1l5',
    chapter: 'Chapter 1 · Text basics',
    title: 'Emphasize with italics',
    goal: 'Learn how to emphasize a word with italics.',
    task: 'Add the <code>&lt;em&gt;</code> tag around a word somewhere in your page.',
    example:'<p>I <em>really</em> love coding.</p>',
    hint:'&lt;em&gt;...&lt;/em&gt; is like &lt;strong&gt; but shows slanted text instead of bold.',
    starter:'<h1>My First Page</h1>\n<p>First paragraph here.</p>\n<p>Second paragraph here.</p>\n\n<!-- Add <em> somewhere -->\n',
    check: function(html){
      if(!/<em[^>]*>[\s\S]+?<\/em>/i.test(html)) return {ok:false, msg:'I could not find any <em>...</em> tag. Add one around a word.'};
      return {ok:true, msg:'Good! <em> means emphasis — the browser shows it italic.'};
    }
  },

  // ---------- CHAPTER 2: LISTS ----------
  {
    id: 'c2l1',
    chapter: 'Chapter 2 · Lists',
    title: 'Bullet list',
    goal: 'Learn how to make a bullet list of items.',
    task: 'Create an unordered list with <code>&lt;ul&gt;</code> and at least <strong>three</strong> list items <code>&lt;li&gt;</code>.',
    example:'<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>JavaScript</li>\n</ul>',
    hint:'A list looks like this:\n&lt;ul&gt;\n  &lt;li&gt;Item one&lt;/li&gt;\n  &lt;li&gt;Item two&lt;/li&gt;\n&lt;/ul&gt;',
    starter:'<!-- Add your list below -->\n',
    check: function(html){
      if(!/<ul[^>]*>[\s\S]*?<\/ul>/i.test(html)) return {ok:false, msg:'I need a <ul>...</ul> unordered list.'};
      var items = html.match(/<li[^>]*>[\s\S]+?<\/li>/gi) || [];
      if(items.length < 3) return {ok:false, msg:'You have ' + items.length + ' list item' + (items.length===1?'':'s') + '. Add ' + (3-items.length) + ' more <li>...</li>.'};
      return {ok:true, msg:'Great list! <ul> makes bullets and <li> is each item.'};
    }
  },
  {
    id: 'c2l2',
    chapter: 'Chapter 2 · Lists',
    title: 'Numbered list',
    goal: 'Learn how to make a numbered (ordered) list.',
    task: 'Create an ordered list using <code>&lt;ol&gt;</code> with at least <strong>three</strong> steps.',
    example:'<ol>\n  <li>Learn HTML</li>\n  <li>Learn CSS</li>\n  <li>Learn JavaScript</li>\n</ol>',
    hint:'&lt;ol&gt; is just like &lt;ul&gt; but shows numbers instead of bullets.',
    starter:'<!-- Add your ordered list below -->\n',
    check: function(html){
      if(!/<ol[^>]*>[\s\S]*?<\/ol>/i.test(html)) return {ok:false, msg:'I need an <ol>...</ol> ordered list.'};

// ============================================================
// STATE
// ============================================================
var STORAGE_KEY = 'sh-course-progress-v1';
var EDITOR_KEY  = 'sh-course-editor-v1';

var progress = (function(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {done:[], current:0}; }
  catch(e){ return {done:[], current:0}; }
})();

var editorStore = (function(){
  try { return JSON.parse(localStorage.getItem(EDITOR_KEY)) || {}; }
  catch(e){ return {}; }
})();

function persistProgress(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
function persistEditor(){
  localStorage.setItem(EDITOR_KEY, JSON.stringify(editorStore));
}

function $(id){ return document.getElementById(id); }

// ============================================================
// SIDEBAR RENDER
// ============================================================
function renderSidebar(){
  var html = '';
  var lastChapter = '';
  lessons.forEach(function(l, i){
    if(l.chapter !== lastChapter){
      html += '<div class="side-module-title">' + l.chapter + '</div>';
      lastChapter = l.chapter;
    }
    var isDone = progress.done.indexOf(l.id) !== -1;
    var isCur  = progress.current === i;
    html += '<div class="side-lesson ' + (isDone ? 'done ' : '') + (isCur ? 'current' : '') + '" data-idx="' + i + '">' +
      '<span class="num2">' + (isDone ? '✓' : (i + 1)) + '</span>' +
      '<span>' + l.title + '</span>' +
    '</div>';
  });
  $('curriculum').innerHTML = html;

  document.querySelectorAll('.side-lesson').forEach(function(el){
    el.addEventListener('click', function(){
      var idx = parseInt(el.dataset.idx, 10);
      // Only allow going back or to next unlocked
      if (idx <= progress.current || progress.done.indexOf(lessons[idx].id) !== -1) {
        progress.current = idx;
        persistProgress();
        renderAll();
      }
    });
  });

  var pct = Math.round(progress.done.length / lessons.length * 100);
  $('miniProgress').textContent = pct + '%';
  $('sideFill').style.width = pct + '%';
}

// ============================================================
// STAGE RENDER
// ============================================================
var currentEditor = null;

function renderStage(){
  var i = progress.current;
  var l = lessons[i];
  if (!l) return;

  $('crumb').textContent = l.chapter;
  $('stageTitle').textContent = 'Lesson ' + (i + 1) + ' — ' + l.title;

  // dots
  var dotsHtml = '';
  lessons.forEach(function(_, k){
    var cls = '';
    if (progress.done.indexOf(lessons[k].id) !== -1) cls = 'done';
    else if (k === i) cls = 'active';
    dotsHtml += '<span class="' + cls + '"></span>';
  });
  $('stageDots').innerHTML = dotsHtml;

  // saved editor state
  var saved = editorStore[l.id] || {};
  var htmlVal = typeof saved.html === 'string' ? saved.html : (l.starter || '');
  var cssVal  = typeof saved.css  === 'string' ? saved.css  : (l.css_starter || '');
  var jsVal   = typeof saved.js   === 'string' ? saved.js   : '';

  var content = '';
  content += '<div class="task-block"><strong>Goal:</strong> ' + l.goal + '<br><strong>Your task:</strong> ' + l.task + '</div>';
  content += '<div class="example-box"><span class="lbl">Example</span><pre>' + escapeHtml(l.example) + '</pre></div>';
  content += '<button class="hint-toggle" id="hintToggle"><i class="fas fa-lightbulb"></i> Show hint</button>';
  content += '<div class="hint-box" id="hintBox">' + l.hint.replace(/\n/g, '<br>') + '</div>';

  // workspace
  content += '<div class="workspace" id="ws">';
  content +=   '<div class="ws-header">';
  content +=     '<div class="ws-tabs">';
  content +=       '<button class="ws-tab active" data-tab="html">HTML</button>';
  if (l.cssCheck) content += '<button class="ws-tab" data-tab="css">CSS</button>';
  content +=       '<button class="ws-tab" data-tab="js">JS</button>';
  content +=     '</div>';
  content +=     '<div class="ws-actions">';
  content +=       '<button class="ws-action" data-action="reset"><i class="fas fa-rotate-left"></i> Reset</button>';
  content +=     '</div>';
  content +=   '</div>';
  content +=   '<div class="ws-body">';
  content +=     '<div class="ws-editor"><textarea id="editor" spellcheck="false"></textarea></div>';
  content +=     '<div class="ws-preview"><iframe id="preview" title="Preview"></iframe></div>';
  content +=   '</div>';
  content += '</div>';

  // feedback
  content += '<div class="feedback" id="feedback"></div>';

  // footer
  var isDone = progress.done.indexOf(l.id) !== -1;
  var canNext = isDone;
  content += '<div class="stage-foot">';
  content +=   '<button class="btn btn-ghost" id="btnPrev"' + (i === 0 ? ' disabled' : '') + '><i class="fas fa-arrow-left"></i> Previous</button>';
  content +=   '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  content +=     '<button class="btn btn-check" id="btnCheck"><i class="fas fa-play"></i> Run &amp; Check</button>';
  content +=     '<button class="btn btn-primary" id="btnNext"' + (canNext ? '' : ' disabled') + '>Next lesson <i class="fas fa-arrow-right"></i></button>';
  content +=   '</div>';
  content += '</div>';

  $('lessonContent').innerHTML = content;

  // editor tabs
  var tabs = document.querySelectorAll('.ws-tab');
  var editor = $('editor');
  var preview = $('preview');
  var activeTab = saved.activeTab || 'html';

  function currentVal(){
    if (activeTab === 'html') return htmlVal;
    if (activeTab === 'css')  return cssVal;
    return jsVal;
  }
  function storeVal(){
    htmlVal = (activeTab === 'html') ? editor.value : htmlVal;
    cssVal  = (activeTab === 'css')  ? editor.value : cssVal;
    jsVal   = (activeTab === 'js')   ? editor.value : jsVal;
  }

  function setTab(tab){
    storeVal();
    activeTab = tab;
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab === tab); });
    editor.value = currentVal();
    saveEditor();
    renderPreview();
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ setTab(t.dataset.tab); });
  });

  editor.value = currentVal();

  // live preview
  function renderPreview(){
    var bodyInner = htmlVal;
    var bodyMatch = htmlVal.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    if (bodyMatch) bodyInner = bodyMatch[1];

    var doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + cssVal + '</style></head><body>' + bodyInner + '</body></html>';
    preview.srcdoc = doc;
    preview.onload = function(){
      if (jsVal) {
        try { preview.contentWindow.eval(jsVal); } catch(e){ console.warn(e); }
      }
    };
  }

  function saveEditor(){
    editorStore[l.id] = {
      html: htmlVal,
      css: cssVal,
      js: jsVal,
      activeTab: activeTab
    };
    persistEditor();
  }

  editor.addEventListener('input', function(){
    storeVal();
    saveEditor();
    clearTimeout(editor._t);
    editor._t = setTimeout(renderPreview, 350);
  });

  editor.addEventListener('keydown', function(e){
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.substring(0, s) + '  ' + editor.value.substring(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
      storeVal(); saveEditor();
    }
  });

  // reset
  document.querySelectorAll('.ws-action').forEach(function(b){
    b.addEventListener('click', function(){
      if (b.dataset.action === 'reset') {
        if (!confirm('Reset the editor to the starter code?')) return;
        htmlVal = l.starter || '';
        cssVal  = l.css_starter || '';
        jsVal   = '';
        editor.value = currentVal();
        saveEditor();
        renderPreview();
      }
    });
  });

  // hint
  $('hintToggle').addEventListener('click', function(){
    $('hintBox').classList.toggle('open');
    this.innerHTML = $('hintBox').classList.contains('open')
      ? '<i class="fas fa-lightbulb"></i> Hide hint'
      : '<i class="fas fa-lightbulb"></i> Show hint';
  });

  // check
  $('btnCheck').addEventListener('click', function(){
    storeVal();
    var result = l.check(htmlVal, cssVal);
    var fb = $('feedback');
    fb.className = 'feedback show ' + (result.ok ? 'success' : 'error');
    fb.innerHTML = '<i class="fas ' + (result.ok ? 'fa-check-circle' : 'fa-circle-exclamation') + '"></i><div>' +
      '<strong>' + (result.ok ? 'Correct!' : 'Not quite yet') + '</strong><br>' + result.msg + '</div>';

    if (result.ok && progress.done.indexOf(l.id) === -1) {
      progress.done.push(l.id);
      persistProgress();
      renderSidebar();
      $('btnNext').disabled = false;
    }
    renderPreview();
  });

  // next
  $('btnNext').addEventListener('click', function(){
    if (progress.done.indexOf(l.id) === -1) return;
    if (i < lessons.length - 1) {
      progress.current = i + 1;
      persistProgress();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      alert('🎉 You have completed every lesson! Excellent work.');
    }
  });

  // prev
  $('btnPrev').addEventListener('click', function(){
    if (i > 0) {
      progress.current = i - 1;
      persistProgress();
      renderAll();
    }
  });

  currentEditor = { getValues: function(){ storeVal(); return {html: htmlVal, css: cssVal, js: jsVal}; } };
  renderPreview();
}

// ============================================================
// RENDER ALL
// ============================================================
function renderAll(){
  renderSidebar();
  renderStage();
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// reset all
document.getElementById('resetAll').addEventListener('click', function(){
  if (!confirm('Erase all progress and start over from lesson 1?')) return;
  progress = { done: [], current: 0 };
  editorStore = {};
  persistProgress();
  persistEditor();
  renderAll();
});

// ============================================================
// RAIN
// ============================================================
(function(){
  var c = document.getElementById('rain');
  var ctx = c.getContext('2d');
  var drops = [];
  function size(){
    c.width = window.innerWidth; c.height = window.innerHeight;
    drops = [];
    var cols = Math.ceil(window.innerWidth / 22);
    for (var i=0;i<cols;i++) drops.push(Math.random()*-30);
  }
  function rain(){
    ctx.fillStyle = 'rgba(8,11,24,.12)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle = '#ff4d5a';
    ctx.font = '14px monospace';
    for (var i=0;i<drops.length;i++){
      ctx.fillText(Math.random()>.5?'0':'1', i*22, drops[i]*22);
      drops[i] += .35;
      if (drops[i]*22 > c.height && Math.random()>.97) drops[i] = 0;
    }
    requestAnimationFrame(rain);
  }
  size();
  window.addEventListener('resize', size);
  rain();
})();

// boot
renderAll();
console.log('Student Hub · Guided Course ready — ' + lessons.length + ' lessons');
</script>
