<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Free Courses | Twarvis School</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            background:#0a0a1a;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow-x:hidden;
        }
        #matrix-canvas {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index:0;
            background:linear-gradient(180deg,#0a0a2e 0%,#0a0a20 50%,#0a0a1a 100%);
        }
        .container {
            position:relative;
            z-index:2;
            max-width:600px;
            width:90%;
            padding:20px;
            animation:fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }
        .card {
            background:rgba(0,0,0,0.7);
            border:2px solid rgba(255,68,68,0.12);
            border-radius:28px;
            padding:45px 35px;
            backdrop-filter:blur(10px);
            box-shadow:0 0 60px rgba(255,68,68,0.02);
            text-align:center;
            animation:float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100%{transform:translateY(0px)}
            50%{transform:translateY(-6px)}
        }
        .card .icon {
            font-size:4rem;
            color:#ff4444;
            margin-bottom:16px;
            display:block;
            animation:pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100%{transform:scale(1);opacity:0.8}
            50%{transform:scale(1.1);opacity:1}
        }
        .card h1 {
            font-size:2.2rem;
            font-weight:800;
            animation:colorChange 2s ease-in-out infinite;
            margin-bottom:12px;
        }
        @keyframes colorChange {
            0% { color: #ff4444; text-shadow: 0 0 30px rgba(255,68,68,0.2); }
            50% { color: #ff6b6b; text-shadow: 0 0 30px rgba(255,107,107,0.2); }
            100% { color: #ff4444; text-shadow: 0 0 30px rgba(255,68,68,0.2); }
        }
        .card p {
            color:rgba(255,255,255,0.3);
            font-size:1.05rem;
            line-height:1.6;
            margin-bottom:20px;
        }
        .card .badge {
            display:inline-block;
            padding:6px 24px;
            background:rgba(255,68,68,0.08);
            border:1px solid rgba(255,68,68,0.08);
            border-radius:50px;
            color:#ff4444;
            font-size:0.8rem;
            font-weight:600;
        }
        .back-link {
            display:inline-block;
            margin-top:20px;
            color:rgba(100,180,255,0.25);
            text-decoration:none;
            font-size:0.85rem;
            transition:0.3s;
        }
        .back-link:hover {
            color:#4a7cf7;
        }
        @media(max-width:480px){
            .card{padding:30px 20px}
            .card h1{font-size:1.6rem}
            .card .icon{font-size:3rem}
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="container">
        <div class="card">
            <span class="icon"><i class="fas fa-graduation-cap"></i></span>
            <h1>📚 Free Courses</h1>
            <p>We're currently updating our free courses library. Check back soon for amazing learning resources!</p>
            <span class="badge"><i class="fas fa-tools"></i> Under Maintenance</span>
            <div style="margin-top:16px;">
                <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const drops = [];
        const columns = Math.ceil(canvas.width / 20);
        for (let i = 0; i < columns; i++) drops[i] = Math.random() * -200;
        function drawRain() {
            ctx.fillStyle = 'rgba(10, 10, 30, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * 20;
                const y = drops[i] * 20;
                ctx.fillStyle = '#ff4444';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff444455';
                ctx.font = 'bold 18px monospace';
                if (y > 0 && y < canvas.height + 50) ctx.fillText(char, x, y);
                ctx.shadowBlur = 0;
                if (drops[i] * 20 > canvas.height + 50 && Math.random() > 0.98) drops[i] = 0;
                drops[i] += 0.4 + Math.random() * 0.3;
            }
            requestAnimationFrame(drawRain);
        }
        drawRain();
    </script>
</body>
</html>
