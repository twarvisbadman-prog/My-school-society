<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>General Chat | Student Hub</title>
    <link rel="icon" type="image/png" href="/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f;
            --bg-2: #13131a;
            --bg-3: #1c1c26;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-dim: #8a8aa0;
            --accent: #ea580c;
            --accent-2: #be185d;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header-title {
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-title .live-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .header-sub {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .header-actions { display: flex; gap: 8px; align-items: center; position: relative; }
        .btn-icon {
            background: var(--bg-3);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover { background: var(--border); }

        /* Admin menu (⋮) */
        .admin-menu-wrap { position: relative; }
        .admin-menu-btn {
            background: var(--bg-3);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .admin-menu-btn:hover { background: var(--border); }
        .admin-menu {
            position: absolute;
            top: 44px;
            right: 0;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px;
            min-width: 190px;
            display: none;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            z-index: 200;
        }
        .admin-menu.show { display: block; }
        .admin-menu button {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            text-align: left;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.83rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-menu button:hover { background: var(--bg-3); }
        .admin-menu button.danger { color: var(--danger); }

        .pinned-bar {
            background: linear-gradient(120deg, rgba(234,88,12,0.15), rgba(190,24,93,0.15));
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            font-size: 0.82rem;
            color: var(--text);
            display: none;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .pinned-bar.show { display: flex; }
        .pinned-bar .pin-icon { color: var(--accent); }
        .pinned-bar .pin-text { flex: 1; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .messages::-webkit-scrollbar { width: 8px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 60px 20px;
            font-size: 0.9rem;
        }
        .empty-state .emoji { font-size: 3rem; display: block; margin-bottom: 12px; }

        .msg {
            display: flex;
            gap: 12px;
            max-width: 100%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            font-size: 0.9rem;
            overflow: hidden;
        }
        .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .msg-body { flex: 1; min-width: 0; }
        .msg-head {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .msg-name { font-weight: 700; font-size: 0.85rem; }
        .msg-name.guest { color: var(--text-dim); font-style: italic; }
        .msg-time { font-size: 0.68rem; color: var(--text-dim); }
        .msg-text {
            background: var(--bg-2);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            display: inline-block;
            max-width: 100%;
        }
        .msg.deleted .msg-text {
            background: rgba(239,68,68,0.08);
            border-color: rgba(239,68,68,0.25);
            color: var(--danger);
            font-style: italic;
        }
        .msg-reply-preview {
            background: rgba(234,88,12,0.08);
            border-left: 3px solid var(--accent);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.76rem;
            color: var(--text-dim);
            margin-bottom: 6px;
        }
        .msg-reply-preview strong { color: var(--accent); }

        .msg-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .reaction-pill {
            background: var(--bg-3);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 0.76rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text);
        }
        .reaction-pill:hover { border-color: var(--accent); }
        .reaction-pill.mine {
            background: rgba(234,88,12,0.15);
            border-color: var(--accent);
        }
        .reaction-add {
            background: transparent;
            border: 1px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .reaction-add:hover { border-color: var(--accent); color: var(--accent); }
        .reply-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.72rem;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 6px;
        }
        .reply-btn:hover { color: var(--accent); }

        .emoji-menu {
            position: absolute;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px;
            display: none;
            gap: 4px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            z-index: 150;
        }
        .emoji-menu.show { display: flex; }
        .emoji-menu button {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
        }
        .emoji-menu button:hover { background: var(--bg-3); }

        .composer {
            background: var(--bg-2);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            flex-shrink: 0;
        }
        .reply-bar {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(234,88,12,0.08);
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .reply-bar.show { display: flex; }
        .reply-bar .reply-text { flex: 1; color: var(--text-dim); }
        .reply-bar .reply-text strong { color: var(--accent); }
        .reply-bar .reply-cancel {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
        }
        .composer-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .composer-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            max-height: 120px;
        }
        .composer-input:focus { border-color: var(--accent); }
        .composer-send {
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .composer-send:disabled { opacity: 0.4; cursor: not-allowed; }
        .composer-info {
            margin-top: 6px;
            font-size: 0.72rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }
        .composer-info .login-cta { color: var(--accent); text-decoration: none; }
        .composer-info .login-cta:hover { text-decoration: underline; }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { opacity: 1; }
        .toast.error { border-color: var(--danger); }
        .toast.success { border-color: var(--success); }

        @media (max-width: 600px) {
            .header { padding: 12px 14px; }
            .messages { padding: 12px 14px; }
            .composer { padding: 10px 14px; }
            .msg-avatar { width: 32px; height: 32px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="header-title">
                💬 General Chat <span class="live-dot"></span>
            </div>
            <div class="header-sub">Ujumbe unafutwa baada ya masaa 24</div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="history.back()" title="Back">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="admin-menu-wrap" id="adminMenuWrap" style="display:none;">
                <button class="admin-menu-btn" id="adminMenuBtn" title="Admin menu">⋮</button>
                <div class="admin-menu" id="adminMenu">
                    <button onclick="editPin()"><i class="fas fa-thumbtack"></i> Pin / Edit pinned</button>
                    <button onclick="adminClearPin()"><i class="fas fa-times"></i> Clear pinned</button>
                    <button class="danger" onclick="adminRefreshAll()"><i class="fas fa-trash"></i> Refresh / cleanup</button>
                </div>
            </div>
        </div>
    </div>

    <div class="pinned-bar" id="pinnedBar">
        <i class="fas fa-thumbtack pin-icon"></i>
        <span class="pin-text" id="pinnedText"></span>
    </div>

    <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
            <span class="emoji">💬</span>
            Hakuna ujumbe bado. Anza mazungumzo!
        </div>
    </div>

    <div class="composer">
        <div class="reply-bar" id="replyBar">
            <div class="reply-text" id="replyText"></div>
            <button class="reply-cancel" onclick="cancelReply()">✕</button>
        </div>
        <div class="composer-row">
            <textarea class="composer-input" id="composerInput" rows="1"
                      placeholder="Andika ujumbe..." maxlength="1000"></textarea>
            <button class="composer-send" id="sendBtn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <div class="composer-info">
            <span id="guestInfo"></span>
            <span id="charCount">0 / 1000</span>
        </div>
    </div>

    <div class="emoji-menu" id="emojiMenu"></div>
    <div class="toast" id="toast"></div>

    <script>
        // ==== Server-rendered constants ====
        const GUEST_LIMIT = {{ guest_limit|default:3 }};
        const ALLOWED_EMOJIS = {{ allowed_emojis|safe }};
        const IS_ADMIN = {{ is_admin|default:"false"|lower }};
        const POLL_MS = 5000; // 5s

        // ==== State ====
        let lastMessageId = null;
        let replyToId = null;
        let pollTimer = null;
        let isLoggedIn = false;
        let activeEmojiMenuId = null;

        // ==== DOM ====
        const messagesEl = document.getElementById('messages');
        const emptyState = document.getElementById('emptyState');
        const composerInput = document.getElementById('composerInput');
        const sendBtn = document.getElementById('sendBtn');
        const charCount = document.getElementById('charCount');
        const replyBar = document.getElementById('replyBar');
        const replyText = document.getElementById('replyText');
        const guestInfo = document.getElementById('guestInfo');
        const pinnedBar = document.getElementById('pinnedBar');
        const pinnedText = document.getElementById('pinnedText');
        const emojiMenu = document.getElementById('emojiMenu');
        const toast = document.getElementById('toast');

        // Admin menu
        const adminMenuWrap = document.getElementById('adminMenuWrap');
        const adminMenuBtn = document.getElementById('adminMenuBtn');
        const adminMenu = document.getElementById('adminMenu');
        if (IS_ADMIN) adminMenuWrap.style.display = 'block';

        // ==== Utils ====
        function getCookie(name) {
            const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return m ? m.pop() : '';
        }
        const CSRF = getCookie('csrftoken');

        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        function timeAgo(iso) {
            if (!iso) return '';
            const then = new Date(iso).getTime();
            const diff = Math.floor((Date.now() - then) / 1000);
            if (diff < 60) return 'sasa hivi';
            if (diff < 3600) return Math.floor(diff / 60) + 'd';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h';
            return Math.floor(diff / 86400) + 'siku';
        }

        function initials(name) {
            if (!name) return '?';
            return name.trim().charAt(0).toUpperCase();
        }

        // ==== Render ====
        function renderAvatar(msg) {
            if (msg.avatar) {
                return `<div class="msg-avatar"><img src="${escapeHtml(msg.avatar)}" alt=""></div>`;
            }
            return `<div class="msg-avatar">${escapeHtml(initials(msg.username))}</div>`;
        }

        function renderReactions(msg) {
            const reactions = msg.reactions || {};
            let html = '';
            Object.keys(reactions).forEach(emoji => {
                const r = reactions[emoji];
                const mine = r.mine ? ' mine' : '';
                html += `<button class="reaction-pill${mine}" data-msg="${msg.id}" data-emoji="${escapeHtml(emoji)}">${emoji} ${r.count}</button>`;
            });
            html += `<button class="reaction-add" data-msg="${msg.id}" title="React">+</button>`;
            return html;
        }

        function renderMessage(msg) {
            const isGuest = !msg.user_id;
            const deleted = msg.is_deleted || msg.deleted_by_admin;
            const reply = msg.reply_to ? `
                <div class="msg-reply-preview">
                    <strong>${escapeHtml(msg.reply_to.username)}</strong>: ${escapeHtml(msg.reply_to.message)}
                </div>` : '';

            let actions = '';
            if (!deleted) {
                actions = `
                    <button class="reply-btn" data-reply="${msg.id}" data-name="${escapeHtml(msg.username)}">
                        <i class="fas fa-reply"></i> Jibu
                    </button>
                    ${renderReactions(msg)}
                    ${IS_ADMIN ? `<button class="reply-btn" data-del="${msg.id}" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
                `;
            }

            return `
                <div class="msg ${deleted ? 'deleted' : ''}" data-id="${msg.id}">
                    ${renderAvatar(msg)}
                    <div class="msg-body">
                        <div class="msg-head">
                            <span class="msg-name ${isGuest ? 'guest' : ''}">${escapeHtml(msg.username)}</span>
                            <span class="msg-time">${timeAgo(msg.created_at)}</span>
                        </div>
                        ${reply}
                        <div class="msg-text">${escapeHtml(msg.message)}</div>
                        <div class="msg-actions">${actions}</div>
                    </div>
                </div>`;
        }

        function appendMessages(messages) {
            if (!messages.length) return;
            if (emptyState) emptyState.style.display = 'none';

            const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
            const frag = document.createElement('div');
            frag.innerHTML = messages.map(renderMessage).join('');
            while (frag.firstChild) messagesEl.appendChild(frag.firstChild);

            if (atBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function renderPinned(pinned) {
            if (pinned && pinned.message) {
                pinnedText.textContent = pinned.message;
                pinnedBar.classList.add('show');
            } else {
                pinnedBar.classList.remove('show');
            }
        }

        // ==== Polling (5s) ====
        async function pollMessages() {
            try {
                const url = lastMessageId
                    ? `/api/chat/messages/?after=${encodeURIComponent(lastMessageId)}`
                    : '/api/chat/messages/';
                const res = await fetch(url, { credentials: 'same-origin' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'fetch failed');

                if (data.messages && data.messages.length) {
                    appendMessages(data.messages);
                    lastMessageId = data.messages[data.messages.length - 1].id;
                }
                renderPinned(data.pinned);
            } catch (e) {
                console.error('[chat poll]', e);
            }
        }

        // ==== Send ====
        async function sendMessage() {
            const raw = composerInput.value.trim();
            if (!raw) return;
            sendBtn.disabled = true;
            try {
                const res = await fetch('/api/chat/send/', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': CSRF,
                    },
                    body: JSON.stringify({ message: raw, reply_to_id: replyToId }),
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.message || data.error || 'Imeshindikana', 'error');
                    return;
                }
                composerInput.value = '';
                composerInput.style.height = 'auto';
                charCount.textContent = '0 / 1000';
                cancelReply();
                await pollMessages();
                updateGuestStatus();
            } catch (e) {
                console.error('[chat send]', e);
                showToast('Hitilafu ya mtandao', 'error');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ==== Inline quote (reply) ====
        function startReply(id, username) {
            replyToId = id;
            replyText.innerHTML = `<strong>${escapeHtml(username)}</strong>`;
            replyBar.classList.add('show');
            composerInput.focus();
        }
        function cancelReply() {
            replyToId = null;
            replyBar.classList.remove('show');
        }

        // ==== Reactions ====
        function openEmojiMenu(anchor, messageId) {
            if (activeEmojiMenuId === messageId && emojiMenu.classList.contains('show')) {
                emojiMenu.classList.remove('show');
                activeEmojiMenuId = null;
                return;
            }
            activeEmojiMenuId = messageId;
            emojiMenu.innerHTML = ALLOWED_EMOJIS
                .map(e => `<button data-msg="${messageId}" data-emoji="${escapeHtml(e)}">${e}</button>`)
                .join('');
            const rect = anchor.getBoundingClientRect();
            emojiMenu.style.top = (rect.bottom + window.scrollY + 6) + 'px';
            emojiMenu.style.left = Math.min(rect.left, window.innerWidth - 260) + 'px';
            emojiMenu.classList.add('show');
        }

        async function toggleReaction(messageId, emoji) {
            emojiMenu.classList.remove('show');
            activeEmojiMenuId = null;
            try {
                const res = await fetch(`/api/chat/react/${messageId}/`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': CSRF,
                    },
                    body: JSON.stringify({ emoji }),
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.error || 'Imeshindikana', 'error');
                    return;
                }
                await reloadAll();
            } catch (e) {
                console.error('[chat react]', e);
            }
        }

        // ==== Admin ====
        async function adminDelete(messageId) {
            if (!confirm('Futa ujumbe huu?')) return;
            try {
                const res = await fetch(`/api/chat/admin/delete/${messageId}/`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'X-CSRFToken': CSRF },
                });
                if (!res.ok) throw new Error('delete failed');
                await reloadAll();
            } catch (e) {
                console.error('[chat delete]', e);
                showToast('Imeshindikana kufuta', 'error');
            }
        }

        async function editPin() {
            const current = pinnedText.textContent || '';
            const next = prompt('Pinned message (leave empty to remove):', current);
            if (next === null) return;
            try {
                const res = await fetch('/api/chat/admin/pin/', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': CSRF,
                    },
                    body: JSON.stringify({ pinned_message: next.trim() }),
                });
                if (!res.ok) throw new Error('pin failed');
                await pollMessages();
            } catch (e) {
                console.error('[chat pin]', e);
                showToast('Imeshindikana', 'error');
            }
        }

        async function adminClearPin() {
            try {
                const res = await fetch('/api/chat/admin/pin/', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': CSRF,
                    },
                    body: JSON.stringify({ pinned_message: '' }),
                });
                if (!res.ok) throw new Error('clear failed');
                await pollMessages();
            } catch (e) {
                console.error('[chat clear pin]', e);
                showToast('Imeshindikana', 'error');
            }
        }

        async function adminRefreshAll() {
            await reloadAll();
            showToast('Refreshed', 'success');
        }

        // ==== Guest status ====
        async function updateGuestStatus() {
            try {
                const res = await fetch('/api/chat/guest-status/', { credentials: 'same-origin' });
                const data = await res.json();
                isLoggedIn = !!data.logged_in;
                if (isLoggedIn) {
                    guestInfo.textContent = '';
                    composerInput.disabled = false;
                    sendBtn.disabled = false;
                } else {
                    const remaining = data.remaining;
                    if (remaining <= 0) {
                        guestInfo.innerHTML = `Umetumia ujumbe wote leo. <a class="login-cta" href="/login/?next=/chat/">Ingia</a> kuchat bila kikomo.`;
                        composerInput.disabled = true;
                        sendBtn.disabled = true;
                    } else {
                        guestInfo.textContent = `Ujumbe ${remaining} umebaki leo (guest).`;
                        composerInput.disabled = false;
                        sendBtn.disabled = false;
                    }
                }
            } catch (e) {
                console.error('[guest status]', e);
            }
        }

        // ==== Full reload (used after reactions / deletes) ====
        async function reloadAll() {
            messagesEl.querySelectorAll('.msg').forEach(el => el.remove());
            if (emptyState) emptyState.style.display = '';
            lastMessageId = null;
            await pollMessages();
        }

        // ==== Event delegation on messages ====
        messagesEl.addEventListener('click', (e) => {
            const reactBtn = e.target.closest('.reaction-pill');
            if (reactBtn) {
                toggleReaction(reactBtn.dataset.msg, reactBtn.dataset.emoji);
                return;
            }
            const addBtn = e.target.closest('.reaction-add');
            if (addBtn) {
                openEmojiMenu(addBtn, addBtn.dataset.msg);
                return;
            }
            const replyBtn = e.target.closest('[data-reply]');
            if (replyBtn) {
                startReply(replyBtn.dataset.reply, replyBtn.dataset.name);
                return;
            }
            const delBtn = e.target.closest('[data-del]');
            if (delBtn) {
                adminDelete(delBtn.dataset.del);
                return;
            }
        });

        emojiMenu.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-emoji]');
            if (btn) toggleReaction(btn.dataset.msg, btn.dataset.emoji);
        });

        // ==== Composer events ====
        composerInput.addEventListener('input', () => {
            charCount.textContent = `${composerInput.value.length} / 1000`;
            composerInput.style.height = 'auto';
            composerInput.style.height = Math.min(composerInput.scrollHeight, 120) + 'px';
        });

        composerInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Close floating menus on outside click
        document.addEventListener('click', (e) => {
            if (!emojiMenu.contains(e.target)) {
                emojiMenu.classList.remove('show');
                activeEmojiMenuId = null;
            }
            if (adminMenu && !adminMenu.contains(e.target) && e.target !== adminMenuBtn) {
                adminMenu.classList.remove('show');
            }
        });

        // Admin ⋮ toggle
        adminMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            adminMenu.classList.toggle('show');
        });

        // ==== Init ====
        (function init() {
            updateGuestStatus();
            pollMessages().then(() => {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            });
            pollTimer = setInterval(pollMessages, POLL_MS);
        })();
    </script>
</body>
</html>
