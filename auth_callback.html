<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in… | Student Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fafaf9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 25% 25%, rgba(234,88,12,.08) 0%, transparent 50%),radial-gradient(circle at 75% 75%, rgba(219,39,119,.08) 0%, transparent 50%);pointer-events:none}
.box{position:relative;z-index:1;text-align:center;padding:44px 40px;background:#fff;border:1px solid #e7e5e4;border-radius:24px;box-shadow:0 28px 64px -20px rgba(28,25,23,.22);max-width:400px;width:100%;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.spinner{width:64px;height:64px;border:4px solid #f5f5f4;border-top-color:#c2410c;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{color:#1c1917;font-size:1.3rem;font-weight:800;margin-bottom:8px}
p{color:#57534e;font-size:.9rem;line-height:1.6}
.error{color:#dc2626;margin-top:12px;font-weight:700;font-size:.82rem;word-break:break-word}
.link{display:inline-block;margin-top:18px;padding:11px 24px;background:linear-gradient(120deg,#c2410c,#be185d);color:#fff;text-decoration:none;border-radius:999px;font-weight:800;font-size:.85rem}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2 id="title">Signing you in…</h2>
  <p id="subtitle">Hang tight while we finish setup.</p>
  <div class="error" id="errorMsg" style="display:none"></div>
  <a href="/login/" class="link" id="loginLink" style="display:none">Go to Login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── Hardcoded Supabase config ─────────────────────────────
const SUPABASE_URL = "https://hnszltswipxiqurkwydm.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhuc3psdHN3aXB4aXF1cmt3eWRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTEyODcsImV4cCI6MjA5MzEyNzI4N30.JsSgMXE9JMqJAAZd-riwrr-D-5MURL6WCfuNTrAtoWU";
// ──────────────────────────────────────────────────────────

(async () => {
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const errorEl = document.getElementById('errorMsg');
  const loginLink = document.getElementById('loginLink');
  const spinner = document.querySelector('.spinner');

  function fail(msg) {
    titleEl.textContent = 'Sign-in failed';
    subtitleEl.textContent = 'Something went wrong. Please try again.';
    errorEl.textContent = msg || 'Unknown error';
    errorEl.style.display = 'block';
    loginLink.style.display = 'inline-block';
    if (spinner) spinner.style.display = 'none';
  }

  try {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Supabase JS v2 automatically detects tokens in the URL hash
    // (#access_token=...&refresh_token=...) and exchanges them.
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;

    let session = data.session;

    // If no session yet, Supabase might still be processing the hash.
    // Give it a moment and retry.
    if (!session) {
      await new Promise(res => setTimeout(res, 800));
      const retry = await sb.auth.getSession();
      session = retry.data.session;
    }

    // Final fallback: explicitly parse hash params
    if (!session && window.location.hash) {
      const params = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      if (accessToken && refreshToken) {
        const setRes = await sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });
        if (setRes.error) throw setRes.error;
        session = setRes.data.session;
      }
    }

    if (!session || !session.access_token) {
      throw new Error('No session found. Please try signing in again.');
    }

    // Set cookies so Django backend can read the token
    document.cookie = `sb-access-token=${session.access_token}; path=/; max-age=${60 * 60 * 24 * 7}; samesite=Lax`;
    document.cookie = `sb-refresh-token=${session.refresh_token}; path=/; max-age=${60 * 60 * 24 * 30}; samesite=Lax`;

    titleEl.textContent = 'Welcome! 🎉';
    subtitleEl.textContent = 'Redirecting to your dashboard…';

    setTimeout(() => {
      window.location.href = '/dashboard/';
    }, 600);

  } catch (err) {
    console.error('[auth_callback]', err);
    fail(err && err.message ? err.message : String(err));
  }
})();
</script>
</body>
</html>
