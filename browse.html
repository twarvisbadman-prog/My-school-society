        /* ===== RED GLOWING DOWNLOAD BUTTON ===== */
        .btn-download {
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 2px solid rgba(255, 0, 0, 0.3);
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            background: rgba(255, 0, 0, 0.1);
            color: #ff3333;
            cursor: pointer;
            animation: redGlow 1.5s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .btn-download:hover {
            background: rgba(255, 0, 0, 0.25);
            border-color: #ff0000;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        @keyframes redGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.1); border-color: rgba(255, 0, 0, 0.3); }
            50% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.3); border-color: rgba(255, 0, 0, 0.7); }
        }

        /* ===== SOCIAL ICONS - VISIBLE ===== */
        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
        }

        .social-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        .social-icon:hover {
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
        }

        .social-icon.tiktok i {
            color: #00f2ea;
            font-size: 1.8rem;
            text-shadow: 0 0 30px rgba(0, 242, 234, 0.2);
        }

        .social-icon.instagram i {
            color: #e4405f;
            font-size: 1.8rem;
            text-shadow: 0 0 30px rgba(228, 64, 95, 0.2);
        }

        .social-icon.tiktok:hover {
            border-color: #00f2ea;
            box-shadow: 0 0 50px rgba(0, 242, 234, 0.15);
        }

        .social-icon.instagram:hover {
            border-color: #e4405f;
            box-shadow: 0 0 50px rgba(228, 64, 95, 0.15);
        }

        /* ===== FOOTER - SHINING TEXT ===== */
        .footer-text {
            margin-top: 30px;
            color: rgba(100, 180, 255, 0.6);
            font-weight: 500;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.08);
            font-size: 0.85rem;
        }

        .footer-text p {
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(100, 180, 255, 0.05); }
            50% { text-shadow: 0 0 40px rgba(100, 180, 255, 0.15); }
        }
    </style>
