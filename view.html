<!-- view.html - FIXED VERSION -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>View Document | Twarvis School</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ... (same styles as before, keep everything) ... */
        /* Make sure the passcode modal works */
        .passcode-modal {
            display: none !important;
        }
        .passcode-modal.active {
            display: flex !important;
        }
        
        /* Make sure viewer is visible by default */
        .pdf-viewer {
            display: block !important;
        }
        .pdf-header {
            display: block !important;
        }
        .action-buttons {
            display: flex !important;
        }
        
        /* For private files, we'll hide these with JS */
        .pdf-viewer.hidden,
        .pdf-header.hidden,
        .action-buttons.hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ... (same HTML structure) ... -->

    <!-- ========== PASSCODE MODAL ========== -->
    {% if note.privacy == 'private' %}
    <div class="passcode-modal active" id="passcodeModal">
        <div class="passcode-modal-content">
            <i class="fas fa-lock"></i>
            <h3>🔒 Private Document</h3>
            <p>This document is protected with a passcode. Please enter the 4-digit passcode to view it.</p>
            <p style="color: #888; font-size: 0.8rem; margin-bottom: 15px;">
                <i class="fas fa-info-circle"></i> Contact the uploader for the passcode
            </p>
            <input type="password" id="passcodeInput" placeholder="••••" maxlength="4" inputmode="numeric" autofocus>
            <div class="passcode-error" id="passcodeError">❌ Incorrect passcode. Please try again.</div>
            <button class="passcode-btn" id="passcodeSubmit">
                <i class="fas fa-unlock"></i> Unlock Document
            </button>
            <button class="passcode-close" onclick="window.location.href='/browse/'">
                <i class="fas fa-arrow-left"></i> Go Back to Browse
            </button>
        </div>
    </div>
    {% endif %}

    <script>
        // ========== PASSCODE HANDLING ==========
        {% if note.privacy == 'private' %}
        const passcodeModal = document.getElementById('passcodeModal');
        const passcodeInput = document.getElementById('passcodeInput');
        const passcodeSubmit = document.getElementById('passcodeSubmit');
        const passcodeError = document.getElementById('passcodeError');
        const correctPasscode = '{{ note.passcode }}';
        
        // Log the passcode for debugging (remove in production)
        console.log('🔑 Correct passcode:', correctPasscode);
        console.log('📝 Note data:', {
            privacy: '{{ note.privacy }}',
            passcode: '{{ note.passcode }}',
            university: '{{ note.university }}',
            file_type: '{{ note.file_type }}'
        });

        // Make sure modal is visible
        passcodeModal.classList.add('active');
        
        // Hide viewer until passcode is entered
        document.getElementById('pdfViewer').classList.add('hidden');
        document.querySelector('.pdf-header').classList.add('hidden');
        document.querySelector('.action-buttons').classList.add('hidden');

        passcodeInput.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
            passcodeError.classList.remove('show');
        });

        passcodeSubmit.addEventListener('click', function() {
            const entered = passcodeInput.value;
            console.log('🔑 Entered passcode:', entered);
            console.log('🔑 Correct passcode:', correctPasscode);
            
            if (entered === correctPasscode) {
                passcodeModal.classList.remove('active');
                // Show the viewer
                document.getElementById('pdfViewer').classList.remove('hidden');
                document.querySelector('.pdf-header').classList.remove('hidden');
                document.querySelector('.action-buttons').classList.remove('hidden');
                lightningFlash(0.3, 0.05);
            } else {
                passcodeError.classList.add('show');
                passcodeInput.value = '';
                passcodeInput.focus();
                lightningFlash(0.3, 0.05);
            }
        });

        passcodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                passcodeSubmit.click();
            }
        });

        // Focus the input when modal appears
        setTimeout(() => {
            passcodeInput.focus();
        }, 500);
        {% endif %}

        // ========== DEBUG INFO ==========
        console.log('📄 Document Info:');
        console.log('  Privacy: {{ note.privacy }}');
        console.log('  University: {{ note.university }}');
        console.log('  File Type: {{ note.file_type }}');
        console.log('  Module: {{ note.module }}');
        console.log('  Course: {{ note.course }}');
    </script>
</body>
</html>
